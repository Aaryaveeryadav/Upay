<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Principal Axis -->
  <line x1="20" y1="130" x2="380" y2="130" stroke="#000000" stroke-width="1.6" />

  <!-- Convex Lens (Central vertical line with curved edges) -->
  <path d="M 200 70 Q 215 130 200 190 Q 185 130 200 70" fill="none" stroke="#000000" stroke-width="1.6" />
  <!-- Lens arrows at top and bottom -->
  <path d="M 195 75 L 200 70 L 205 75" fill="none" stroke="#000000" stroke-width="1.6" />
  <path d="M 195 185 L 200 190 L 205 185" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Optical Center (O), Foci (F1, F2), and 2F points -->
  <!-- Left side: F1 and 2F1 -->
  <circle cx="120" cy="130" r="2" fill="#000000" />
  <circle cx="60" cy="130" r="2" fill="#000000" />
  <!-- Right side: F2 and 2F2 -->
  <circle cx="280" cy="130" r="2" fill="#000000" />
  <circle cx="340" cy="130" r="2" fill="#000000" />
  <!-- Optical center -->
  <circle cx="200" cy="130" r="2" fill="#000000" />

  <!-- Object (AB) placed beyond 2F1 -->
  <line x1="80" y1="90" x2="80" y2="130" stroke="#000000" stroke-width="1.6" />
  <path d="M 76 98 L 80 90 L 84 98" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Image (A'B') formed between F2 and 2F2 (real and inverted) -->
  <line x1="310" y1="130" x2="310" y2="160" stroke="#000000" stroke-width="1.6" />
  <path d="M 306 152 L 310 160 L 314 152" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Light Rays -->
  <!-- Ray 1: Parallel to principal axis, passes through F2 -->
  <line x1="80" y1="90" x2="200" y2="90" stroke="#000000" stroke-width="1.6" />
  <line x1="200" y1="90" x2="310" y2="160" stroke="#000000" stroke-width="1.6" />

  <!-- Ray 2: Passes through optical center O without deviation -->
  <line x1="80" y1="90" x2="310" y2="160" stroke="#000000" stroke-width="1.6" />

  <!-- Ray 3: Passes through F1, emerges parallel to principal axis -->
  <line x1="80" y1="90" x2="120" y2="130" stroke="#000000" stroke-width="1.6" />
  <line x1="120" y1="130" x2="200" y2="160" stroke="#000000" stroke-width="1.6" />
  <line x1="200" y1="160" x2="310" y2="160" stroke="#000000" stroke-width="1.6" />

  <!-- Arrowheads on rays -->
  <polygon points="145,90 141,87 141,93" fill="#000000" />
  <polygon points="255,125 251,122 251,128" fill="#000000" />
  <polygon points="140,110 137,106 143,107" fill="#000000" />

  <!-- Labels -->
  <text x="75" y="82" font-family="sans-serif" font-size="12" fill="#000000">A</text>
  <text x="75" y="142" font-family="sans-serif" font-size="12" fill="#000000">B</text>
  
  <text x="315" y="173" font-family="sans-serif" font-size="12" fill="#000000">A'</text>
  <text x="315" y="125" font-family="sans-serif" font-size="12" fill="#000000">B'</text>

  <text x="56" y="148" font-family="sans-serif" font-size="11" fill="#000000">2F₁</text>
  <text x="115" y="148" font-family="sans-serif" font-size="11" fill="#000000">F₁</text>
  <text x="196" y="145" font-family="sans-serif" font-size="11" fill="#000000">O</text>
  <text x="275" y="148" font-family="sans-serif" font-size="11" fill="#000000">F₂</text>
  <text x="333" y="148" font-family="sans-serif" font-size="11" fill="#000000">2F₂</text>
</svg>