<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Media Separation Line (Interface) -->
  <line x1="40" y1="130" x2="360" y2="130" stroke="#000000" stroke-width="1.6" />

  <!-- Normal Line (Perpendicular) -->
  <line x1="200" y1="20" x2="200" y2="240" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Incident Ray -->
  <line x1="100" y1="30" x2="200" y2="130" stroke="#000000" stroke-width="1.6" />
  <!-- Arrow on Incident Ray -->
  <polygon points="145,75 155,79 151,87" fill="#000000" />

  <!-- Refracted Ray -->
  <line x1="200" y1="130" x2="235" y2="230" stroke="#000000" stroke-width="1.6" />
  <!-- Arrow on Refracted Ray -->
  <polygon points="214,170 220,178 212,181" fill="#000000" />

  <!-- Angle Arcs -->
  <!-- Angle of incidence (60 deg representation) -->
  <path d="M 175,105 A 30,30 0 0,1 200,100" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- Angle of refraction -->
  <path d="M 200,155 A 25,25 0 0,1 212,162" fill="none" stroke="#000000" stroke-width="1.2" />

  <!-- Labels -->
  <text x="70" y="55" font-family="sans-serif" font-size="14" fill="#000000">Medium 1</text>
  <text x="70" y="210" font-family="sans-serif" font-size="14" fill="#000000">Medium 2</text>
  <text x="165" y="115" font-family="sans-serif" font-size="14" fill="#000000">60°</text>
  <text x="215" y="155" font-family="sans-serif" font-size="14" fill="#000000">r</text>
  <text x="210" y="40" font-family="sans-serif" font-size="12" fill="#000000">Normal</text>
</svg>