<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Flower Female Reproductive Organ (Carpel/Pistil) & Germination -->
  <g fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Stigma (lobes at the top) -->
    <path d="M 180,50 C 170,40 185,25 200,35 C 215,25 230,40 220,50 
             C 230,55 225,70 200,70 C 175,70 170,55 180,50 Z" />

    <!-- Style (tubular neck) -->
    <path d="M 188,70 L 188,140" />
    <path d="M 212,70 L 212,140" />

    <!-- Ovary (swollen base) -->
    <path d="M 188,140 C 150,150 140,200 170,225 C 190,240 210,240 230,225 C 260,200 250,150 212,140 Z" />

    <!-- Ovule inside the ovary -->
    <path d="M 185,185 C 175,185 170,205 185,215 C 200,205 195,185 185,185 Z" />
    <!-- Female germ cell (egg) inside ovule -->
    <circle cx="185" cy="198" r="4" fill="#000000" />

    <!-- Germinating Pollen Grain on Stigma -->
    <!-- Pollen grain 1 (germinating) -->
    <circle cx="195" cy="38" r="8" fill="#ffffff" />
    <circle cx="193" cy="36" r="1.5" fill="#000000" />
    <circle cx="198" cy="40" r="1.5" fill="#000000" />

    <!-- Pollen tube growing down through style and into the ovule -->
    <path d="M 198,45 Q 192,90 200,140 T 185,190" stroke-dasharray="3,3" />

    <!-- Pollen grain 2 (non-germinating, for realism) -->
    <circle cx="210" cy="42" r="7" fill="#ffffff" />
    <circle cx="208" cy="40" r="1.5" fill="#000000" />
  </g>

  <!-- Labels and Leader Lines -->
  <g font-family="sans-serif" font-size="11" fill="#000000">
    <!-- (a) The part that receives the pollen grain (Stigma) -->
    <text x="245" y="40">(a) Stigma</text>
    <polyline points="225,40 240,40" fill="none" stroke="#000000" stroke-width="1.2" />

    <!-- (b) The structure that carries the male germ cell (Pollen tube) -->
    <text x="245" y="115">(b) Pollen tube</text>
    <polyline points="204,115 240,115" fill="none" stroke="#000000" stroke-width="1.2" />
  </g>

</svg>