<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #000; }
    .label { font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Media Separation Line (Interface) -->
  <line x1="40" y1="130" x2="360" y2="130" stroke="#000000" stroke-width="1.6" />

  <!-- Normal Line (dashed) -->
  <line x1="200" y1="30" x2="200" y2="230" stroke="#000000" stroke-width="1.2" stroke-dasharray="5,5" />

  <!-- Incident Ray -->
  <line x1="100" y1="50" x2="200" y2="130" stroke="#000000" stroke-width="1.6" />
  
  <!-- Refracted Ray -->
  <line x1="200" y1="130" x2="270" y2="210" stroke="#000000" stroke-width="1.6" />

  <!-- Arrow on Incident Ray -->
  <polygon points="145,86 153,92 147,98" fill="#000000" />

  <!-- Arrow on Refracted Ray -->
  <polygon points="228,162 237,164 233,173" fill="#000000" />

  <!-- Angle arcs -->
  <!-- Angle i (incidence) -->
  <path d="M 180,95 A 30,30 0 0,1 200,100" fill="none" stroke="#000000" stroke-width="1.2" />
  <text x="175" y="90" class="label">60°</text>

  <!-- Angle r (refraction) -->
  <path d="M 200,165 A 40,40 0 0,0 220,172" fill="none" stroke="#000000" stroke-width="1.2" />
  <text x="225" y="180" class="label">45°</text>

  <!-- Labels for Media and Normal -->
  <text x="60" y="80" class="label">Medium-1</text>
  <text x="60" y="170" class="label">Medium-2</text>
  <text x="210" y="45" class="label">N</text>

</svg>