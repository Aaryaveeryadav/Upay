<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 12px; font-weight: bold; }
    .ray { fill: none; stroke: #000; stroke-width: 1.6; }
    .virtual-ray { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 4,4; }
    .axis, .mirror, .object, .image { fill: none; stroke: #000; stroke-width: 1.6; }
    .virtual-object { fill: none; stroke: #000; stroke-width: 1.6; stroke-dasharray: 4,4; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Principal Axis -->
  <line x1="20" y1="170" x2="380" y2="170" class="axis" />

  <!-- Concave Mirror (Aperture centered around P at x=280) -->
  <path d="M 280 80 Q 250 170 280 260" class="mirror" />
  <!-- Mirror back-hatching -->
  <line x1="284" y1="90" x2="294" y2="95" class="ray" />
  <line x1="289" y1="110" x2="299" y2="115" class="ray" />
  <line x1="292" y1="130" x2="302" y2="135" class="ray" />
  <line x1="293" y1="150" x2="303" y2="155" class="ray" />
  <line x1="293" y1="170" x2="303" y2="175" class="ray" />
  <line x1="292" y1="190" x2="302" y2="195" class="ray" />
  <line x1="289" y1="210" x2="299" y2="215" class="ray" />
  <line x1="284" y1="230" x2="294" y2="235" class="ray" />

  <!-- Points F (Focus) and C (Center of Curvature) -->
  <!-- Let Pole P = (280, 170), Focus F = (200, 170), Center C = (120, 170) -->
  <circle cx="280" cy="170" r="2" fill="#000" />
  <circle cx="200" cy="170" r="2" fill="#000" />
  <circle cx="120" cy="170" r="2" fill="#000" />

  <text x="277" y="185">P</text>
  <text x="197" y="185">F</text>
  <text x="117" y="185">C</text>

  <!-- Object AB placed between P and F (e.g., at x = 240) -->
  <line x1="240" y1="170" x2="240" y2="130" class="object" />
  <!-- Arrowhead for Object -->
  <polygon points="240,126 236,134 244,134" fill="#000" />
  <text x="236" y="153" class="label">A</text>
  <text x="242" y="130" class="label">B</text>

  <!-- Virtual Image A'B' behind the mirror -->
  <!-- Object height = 40, distance to P = 40. Magnification = R/(R-u) = 80/(80-40) = 2. Image height = 80. Image pos = 280 + 80 = 360 -->
  <line x1="360" y1="170" x2="360" y2="90" class="virtual-object" />
  <!-- Arrowhead for Image -->
  <polygon points="360,86 356,94 364,94" fill="#000" />
  <text x="350" y="140" class="label">A'</text>
  <text x="364" y="94" class="label">B'</text>

  <!-- Ray 1: Parallel to principal axis, reflects through F -->
  <!-- Incident ray from B(240,130) to mirror at (280, 130) -->
  <line x1="240" y1="130" x2="280" y2="130" class="ray" />
  <polygon points="263,126 263,134 273,130" fill="#000" />
  <!-- Reflected ray from (280,130) passing through F(200,170) -->
  <!-- Equation of line: passes through (280,130) and (200,170). Slope = (170-130)/(200-280) = 40/-80 = -0.5 -->
  <!-- Extends forward -->
  <line x1="280" y1="130" x2="170" y2="185" class="ray" />
  <polygon points="220,155 215,160 223,163" fill="#000" />
  <!-- Backward virtual extension of Ray 1 -->
  <line x1="280" y1="130" x2="360" y2="90" class="virtual-ray" />

  <!-- Ray 2: Passing through C (or directed away from C) reflects back along same path -->
  <!-- Incident ray from B(240,130) through C(120,170) hitting mirror at approx (264.6, 137.7) -->
  <!-- Let's calculate precise intersection with parabola/circle approximation for mirror, or just draw geometrically correct line. -->
  <!-- Using straight line from C(120,170) through B(240,130) to mirror -->
  <!-- Line equation: y - 170 = ((130-170)/(240-120)) * (x - 120) => y - 170 = -1/3 (x - 120) -->
  <!-- Mirror shape near center: vertical line approximation is acceptable for paraxial rays, but let's use the actual drawn arc: x = 280 - (y-170)^2 / 160 roughly. Let's use intersection at y = 146.7, x = 277.8 -->
  <!-- Simpler: Just connect C(120,170) through B(240,130) to hit mirror at (272, 126) and reflect back -->
  <line x1="120" y1="170" x2="274" y2="120" class="ray" />
  <polygon points="200,143 194,145 198,151" fill="#000" />
  <!-- Reflected ray from mirror surface back -->
  <line x1="274" y1="120" x2="190" y2="148" class="ray" />
  <!-- Backward virtual extension of Ray 2 -->
  <line x1="274" y1="120" x2="360" y2="90" class="virtual-ray" />

</svg>