<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 10px; font-weight: bold; }
    .title { font-size: 12px; font-weight: bold; text-anchor: middle; }
    .draw { fill: none; stroke: #000; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .chloroplast { fill: #fff; stroke: #000; stroke-width: 1.2; }
    .dot { fill: #000; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- ==================== (a) STOMATAL PORE DIAGRAMS ==================== -->

  <!-- Open Stoma -->
  <g transform="translate(100, 95)">
    <text x="0" y="-75" class="title">Open Stomatal Pore</text>
    
    <!-- Epidermal cells (background context) -->
    <path d="M -75,-50 L -45,-60 L -15,-55 L 15,-60 L 45,-55 L 75,-50 L 80,0 L 75,50 L 45,60 L 15,55 L -15,60 L -45,55 L -75,50 L -80,0 Z" class="draw" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Guard Cell 1 (Left Open) -->
    <path d="M 0,-45 C -45,-45 -55,0 0,45 C -25,20 -25,-20 0,-45 Z" class="draw" />
    
    <!-- Guard Cell 2 (Right Open) -->
    <path d="M 0,-45 C 45,-45 55,0 0,45 C 25,20 25,-20 0,-45 Z" class="draw" />

    <!-- Chloroplasts Left -->
    <ellipse cx="-20" cy="-25" rx="6" ry="4" transform="rotate(-30 -20 -25)" class="chloroplast" />
    <ellipse cx="-28" cy="5" rx="6" ry="4" transform="rotate(10 -28 5)" class="chloroplast" />
    <ellipse cx="-18" cy="30" rx="6" ry="4" transform="rotate(45 -18 30)" class="chloroplast" />

    <!-- Chloroplasts Right -->
    <ellipse cx="20" cy="-25" rx="6" ry="4" transform="rotate(30 20 -25)" class="chloroplast" />
    <ellipse cx="28" cy="5" rx="6" ry="4" transform="rotate(-10 28 5)" class="chloroplast" />
    <ellipse cx="18" cy="30" rx="6" ry="4" transform="rotate(-45 18 30)" class="chloroplast" />

    <!-- Nuclei/Dots inside guard cells -->
    <circle cx="-10" cy="-2" r="2.5" class="dot" />
    <circle cx="10" cy="-2" r="2.5" class="dot" />

    <!-- Labels with pointer lines -->
    <!-- Guard Cell label -->
    <line x1="-35" y1="-30" x2="-65" y2="-55" class="draw" stroke-width="1" />
    <text x="-95" y="-58" class="label">Guard cell</text>

    <!-- Stomatal Pore label -->
    <line x1="0" y1="0" x2="50" y2="-20" class="draw" stroke-width="1" />
    <text x="54" y="-20" class="label">Stomatal pore</text>

    <!-- Chloroplast label -->
    <line x1="24" y1="10" x2="60" y2="25" class="draw" stroke-width="1" />
    <text x="64" y="28" class="label">Chloroplast</text>
  </g>


  <!-- Closed Stoma -->
  <g transform="translate(300, 95)">
    <text x="0" y="-75" class="title">Closed Stomatal Pore</text>

    <!-- Epidermal cells (background context) -->
    <path d="M -75,-50 L -45,-60 L -15,-55 L 15,-60 L 45,-55 L 75,-50 L 80,0 L 75,50 L 45,60 L 15,55 L -15,60 L -45,55 L -75,50 L -80,0 Z" class="draw" stroke-dasharray="3,3" stroke-width="1" />

    <!-- Guard Cell 1 (Left Closed) -->
    <path d="M 0,-45 C -30,-45 -35,0 0,45 C -15,20 -15,-20 0,-45 Z" class="draw" />

    <!-- Guard Cell 2 (Right Closed) -->
    <path d="M 0,-45 C 30,-45 35,0 0,45 C 15,20 15,-20 0,-45 Z" class="draw" />

    <!-- Chloroplasts Left -->
    <ellipse cx="-15" cy="-20" rx="5" ry="3" transform="rotate(-20 -15 -20)" class="chloroplast" />
    <ellipse cx="-18" cy="15" rx="5" ry="3" transform="rotate(20 -18 15)" class="chloroplast" />

    <!-- Chloroplasts Right -->
    <ellipse cx="15" cy="-20" rx="5" ry="3" transform="rotate(20 15 -20)" class="chloroplast" />
    <ellipse cx="18" cy="15" rx="5" ry="3" transform="rotate(-20 18 15)" class="chloroplast" />

    <!-- Nuclei -->
    <circle cx="-7" cy="-2" r="2" class="dot" />
    <circle cx="7" cy="-2" r="2" class="dot" />
  </g>


  <!-- ==================== (b) & (c) TEXT SECTION ==================== -->

  <line x1="20" y1="165" x2="380" y2="165" class="draw" stroke-width="1" />

  <!-- (b) Events of Photosynthesis -->
  <text x="25" y="182" class="label">(b) Main events of photosynthesis:</text>
  <text x="35" y="198" class="text">1. Absorption of light energy by chlorophyll.</text>
  <text x="35" y="214" class="text">2. Conversion of light energy to chemical energy and splitting of water</text>
  <text x="50" y="228" class="text">molecules into hydrogen and oxygen.</text>
  <text x="35" y="244" class="text">3. Reduction of carbon dioxide to carbohydrates.</text>

  <!-- (c) Chemical Equation -->
  <text x="235" y="182" class="label">(c) Equation:</text>
  <text x="235" y="202" class="text">6CO₂ + 12H₂O</text>
  <!-- Arrow with sunlight/chlorophyll -->
  <g transform="translate(322, 195)">
    <line x1="-12" y1="-4" x2="12" y2="-4" class="draw" />
    <polygon points="12,-7 18,-4 12,-1" fill="#000" />
    <text x="-2" y="-10" style="font-size: 8px; text-anchor: middle;">Sunlight</text>
    <text x="-2" y="6" style="font-size: 8px; text-anchor: middle;">Chlorophyll</text>
  </g>
  <text x="350" y="202" class="text">C₆H₁₂O₆</text>
  <text x="245" y="220" class="text">+ 6O₂ + 6H₂O</text>
</svg>