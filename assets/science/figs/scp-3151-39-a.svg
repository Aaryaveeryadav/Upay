<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #000;
    }
    .bold {
      font-weight: bold;
    }
    .line {
      fill: none;
      stroke: #000;
      stroke-width: 1.6;
    }
    .dashed {
      stroke-dasharray: 4,4;
    }
    .arrow {
      fill: #000;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff"/>

  <!-- Bar Magnet -->
  <!-- Magnet Body -->
  <rect x="150" y="105" width="100" height="40" fill="#fff" stroke="#000" stroke-width="1.6"/>
  <!-- Magnet Poles text -->
  <text x="170" y="130" class="bold" font-size="16">N</text>
  <text x="218" y="130" class="bold" font-size="16">S</text>

  <!-- Magnetic Field Lines (Loops from N to S outside, S to N inside) -->
  
  <!-- Outermost Field Line 1 (Top) -->
  <path d="M 175,105 C 175,30 225,30 225,105" class="line"/>
  <!-- Arrow Top Out (Left to Right) -->
  <polygon points="200,53 195,50 195,56" class="arrow"/>

  <!-- Outermost Field Line 1 (Bottom) -->
  <path d="M 175,145 C 175,220 225,220 225,145" class="line"/>
  <!-- Arrow Bottom Out (Right to Left) -->
  <polygon points="200,197 205,194 205,200" class="arrow"/>

  <!-- Field Line 2 (Mid-Outer Top) -->
  <path d="M 165,105 C 165,55 235,55 235,105" class="line"/>
  <polygon points="200,73 195,70 195,76" class="arrow"/>

  <!-- Field Line 2 (Mid-Outer Bottom) -->
  <path d="M 165,145 C 165,195 235,195 235,145" class="line"/>
  <polygon points="200,177 205,174 205,180" class="arrow"/>

  <!-- Field Line 3 (Inner Top) -->
  <path d="M 155,105 C 155,80 245,80 245,105" class="line"/>
  <polygon points="200,91 195,88 195,94" class="arrow"/>

  <!-- Field Line 3 (Inner Bottom) -->
  <path d="M 155,145 C 155,170 245,170 245,145" class="line"/>
  <polygon points="200,159 205,156 205,162" class="arrow"/>

  <!-- Inside Magnet Field Line (S to N) -->
  <line x1="215" y1="125" x2="185" y2="125" class="line"/>
  <polygon points="195,125 199,122 199,128" class="arrow"/>

</svg>