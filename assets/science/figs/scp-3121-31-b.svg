<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: sans-serif; font-size: 11px; fill: #000; }
    .label { font-weight: bold; }
    .ray-r { stroke: #d00; stroke-width: 1.5; fill: none; }
    .ray-v { stroke: #00d; stroke-width: 1.5; fill: none; }
    .ray-in { stroke: #000; stroke-width: 1.5; fill: none; }
    .droplet { fill: #f0f8ff; stroke: #000; stroke-width: 1.6; }
    .axis { stroke: #666; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Sunlight rays entering from the left -->
  <line x1="40" y1="90" x2="140" y2="90" class="ray-in" />
  <line x1="40" y1="130" x2="160" y2="130" class="ray-in" />
  <text x="35" y="85">Sunlight</text>

  <!-- Water droplet (Circle) -->
  <circle cx="200" cy="130" r="70" class="droplet" />

  <!-- INTERNAL RAYS -->
  <!-- Refraction at entry (C) -->
  <!-- Red ray inside -->
  <path d="M 153.6 83.3 L 235 175" class="ray-r" />
  <!-- Violet ray inside -->
  <path d="M 153.6 83.3 L 210 195" class="ray-v" />

  <!-- Internal Reflection (B) happens at bottom right -->
  <!-- Reflection to exit point -->
  <path d="M 235 175 L 180 198" class="ray-r" />
  <path d="M 210 195 L 165 190" class="ray-v" />

  <!-- Final refraction and dispersion out of droplet to observer (A) -->
  <!-- Red ray exiting downwards-left -->
  <path d="M 180 198 L 100 240" class="ray-r" />
  <!-- Violet ray exiting more steeply -->
  <path d="M 165 190 L 70 245" class="ray-v" />

  <!-- LABELS AS REQUESTED BY QUESTION -->
  <!-- A: Dispersion of light (where rays enter/split) -->
  <circle cx="153.6" cy="83.3" r="3" fill="#000" />
  <text x="110" y="65" class="label">A</text>
  <line x1="125" y1="68" x2="150" y2="80" stroke="#000" stroke-width="0.8" />

  <!-- B: Internal reflection -->
  <circle cx="235" cy="175" r="3" fill="#000" />
  <text x="250" y="180" class="label">B</text>
  <line x1="245" y1="178" x2="238" y2="176" stroke="#000" stroke-width="0.8" />

  <!-- C: Refraction of light (entry/exit interface) -->
  <circle cx="180" cy="198" r="3" fill="#000" />
  <text x="185" y="220" class="label">C</text>
  <line x1="185" y1="210" x2="181" y2="200" stroke="#000" stroke-width="0.8" />

  <!-- Additional labels for clarity -->
  <text x="240" y="90">Water Drop</text>
  <text x="50" y="250" class="label">Observer</text>
  <text x="210" y="130" class="axis" />

</svg>