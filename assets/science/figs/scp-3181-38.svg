<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 12px; font-weight: bold; }
  </style>

  <!-- White Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- Main Circuit Loop -->
  <!-- Top wire with Ammeter and Key -->
  <line x1="80" y1="50" x2="160" y2="50" stroke="#000" stroke-width="1.6" />
  <line x1="220" y1="50" x2="280" y2="50" stroke="#000" stroke-width="1.6" />
  <line x1="320" y1="50" x2="340" y2="50" stroke="#000" stroke-width="1.6" />

  <!-- Right vertical wire -->
  <line x1="340" y1="50" x2="340" y2="210" stroke="#000" stroke-width="1.6" />

  <!-- Bottom wire with Resistance wire AB -->
  <line x1="60" y1="210" x2="140" y2="210" stroke="#000" stroke-width="1.6" />
  <line x1="220" y1="210" x2="340" y2="210" stroke="#000" stroke-width="1.6" />

  <!-- Left vertical wire with Battery -->
  <line x1="60" y1="50" x2="60" y2="95" stroke="#000" stroke-width="1.6" />
  <line x1="60" y1="165" x2="60" y2="210" stroke="#000" stroke-width="1.6" />

  <!-- Battery (Four cells in series) -->
  <g transform="translate(60, 130)">
    <!-- Cell 1 -->
    <line x1="-12" y1="-35" x2="12" y2="-35" stroke="#000" stroke-width="1.6" />
    <line x1="-6" y1="-29" x2="6" y2="-29" stroke="#000" stroke-width="1.6" />
    <!-- Cell 2 -->
    <line x1="-12" y1="-15" x2="12" y2="-15" stroke="#000" stroke-width="1.6" />
    <line x1="-6" y1="-9" x2="6" y2="-9" stroke="#000" stroke-width="1.6" />
    <!-- Cell 3 -->
    <line x1="-12" y1="5" x2="12" y2="5" stroke="#000" stroke-width="1.6" />
    <line x1="-6" y1="11" x2="6" y2="11" stroke="#000" stroke-width="1.6" />
    <!-- Cell 4 -->
    <line x1="-12" y1="25" x2="12" y2="25" stroke="#000" stroke-width="1.6" />
    <line x1="-6" y1="31" x2="6" y2="31" stroke="#000" stroke-width="1.6" />
    
    <!-- Connecting lines inside battery stack -->
    <line x1="0" y1="-35" x2="0" y2="-40" stroke="#000" stroke-width="1.6" />
    <line x1="0" y1="-29" x2="0" y2="-15" stroke="#000" stroke-width="1.6" />
    <line x1="0" y1="-9" x2="0" y2="5" stroke="#000" stroke-width="1.6" />
    <line x1="0" y1="11" x2="0" y2="25" stroke="#000" stroke-width="1.6" />
    <line x1="0" y1="31" x2="0" y2="35" stroke="#000" stroke-width="1.6" />
  </g>

  <!-- Ammeter (A) -->
  <circle cx="190" cy="50" r="16" fill="#fff" stroke="#000" stroke-width="1.6" />
  <text x="186" y="54" class="label">A</text>

  <!-- Plug Key (K) -->
  <g transform="translate(300, 50)">
    <circle cx="-20" cy="0" r="3" fill="#000" />
    <circle cx="20" cy="0" r="3" fill="#000" />
    <line x1="-17" y1="0" x2="10" y2="-10" stroke="#000" stroke-width="1.6" />
    <text x="-4" y="-15" class="label">K</text>
  </g>

  <!-- Resistance Wire AB (Constantan/Nichrome wire) -->
  <line x1="140" y1="210" x2="220" y2="210" stroke="#000" stroke-width="2.5" />
  <text x="145" y="202" class="label">A</text>
  <text x="210" y="202" class="label">B</text>
  <!-- Terminals for wire AB -->
  <circle cx="140" cy="210" r="3" fill="#000" />
  <circle cx="220" cy="210" r="3" fill="#000" />

  <!-- Voltmeter (V) connected across AB -->
  <!-- Voltmeter wires -->
  <line x1="140" y1="210" x2="140" y2="245" stroke="#000" stroke-width="1.6" />
  <line x1="220" y1="210" x2="220" y2="245" stroke="#000" stroke-width="1.6" />
  <line x1="140" y1="245" x2="164" y2="245" stroke="#000" stroke-width="1.6" />
  <line x1="220" y1="245" x2="196" y2="245" stroke="#000" stroke-width="1.6" />

  <!-- Voltmeter Circle -->
  <circle cx="180" cy="245" r="16" fill="#fff" stroke="#000" stroke-width="1.6" />
  <text x="176" y="249" class="label">V</text>

</svg>