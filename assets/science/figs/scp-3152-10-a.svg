<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: sans-serif; font-size: 12px; fill: #000; }
    .label { font-size: 11px; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Title / Question context -->
  <text x="30" y="30" font-weight="bold">Question 3: Stomatal Pore Apparatus</text>

  <!-- Bean-shaped guard cells and stomatal pore -->
  <g transform="translate(200, 140)">
    <!-- Epidermal cells surrounding guard cells (background context) -->
    <path d="M -80,-80 L 80,-80 L 90,80 L -70,90 Z" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="4,4"/>

    <!-- Left Guard Cell -->
    <path d="M 0,-50 C -45,-50 -60,-15 -60,0 C -60,15 -45,50 0,50 C -20,30 -25,10 -25,0 C -25,-10 -20,-30 0,-50 Z" fill="none" stroke="#000" stroke-width="1.6" />
    
    <!-- Right Guard Cell -->
    <path d="M 0,-50 C 45,-50 60,-15 60,0 C 60,15 45,50 0,50 C 20,30 25,10 25,0 C 25,-10 20,-30 0,-50 Z" fill="none" stroke="#000" stroke-width="1.6" />

    <!-- Nucleus and chloroplast dots in Guard Cells -->
    <circle cx="-35" cy="-20" r="3" fill="#000" />
    <circle cx="-30" cy="25" r="3" fill="#000" />
    <circle cx="35" cy="-20" r="3" fill="#000" />
    <circle cx="30" cy="25" r="3" fill="#000" />
    <circle cx="-10" cy="0" r="4" fill="none" stroke="#000" stroke-width="1.2" />
    <circle cx="10" cy="0" r="4" fill="none" stroke="#000" stroke-width="1.2" />

    <!-- Stomatal Pore (Opening) -->
    <ellipse cx="0" cy="0" rx="8" ry="35" fill="none" stroke="#000" stroke-width="1.2" />
  </g>

  <!-- Pointers and Labels -->
  <!-- Guard Cell Label -->
  <line x1="165" y1="120" x2="110" y2="90" stroke="#000" stroke-width="1.2" />
  <text x="35" y="85" class="label">Guard cell</text>

  <!-- Stomatal Pore Label -->
  <line x1="200" y1="140" x2="250" y2="80" stroke="#000" stroke-width="1.2" />
  <text x="255" y="80" class="label">Stomatal pore</text>

  <!-- Epidermal Cell Label -->
  <line x1="130" y1="75" x2="80" y2="50" stroke="#000" stroke-width="1.2" />
  <text x="15" y="48" class="label">Epidermal cell</text>

  <!-- Chloroplast / Nucleus Indicator -->
  <line x1="168" y1="160" x2="110" y2="190" stroke="#000" stroke-width="1.2" />
  <text x="50" y="200" class="label">Chloroplast</text>

</svg>