<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 13px;
      fill: #000;
    }
    .ray {
      fill: none;
      stroke: #000;
      stroke-width: 1.6;
    }
    .normal {
      fill: none;
      stroke: #555;
      stroke-width: 1.1;
      stroke-dasharray: 4,4;
    }
    .prism {
      fill: none;
      stroke: #000;
      stroke-width: 1.8;
    }
    .angle-arc {
      fill: none;
      stroke: #000;
      stroke-width: 1.1;
    }
  </style>

  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Triangular Glass Prism (ABC) -->
  <polygon points="150,50 80,200 240,200" class="prism" />

  <!-- Normals -->
  <!-- First surface normal at P (approx 110, 137.5) -->
  <line x1="110" y1="137.5" x2="82" y2="100" class="normal" />
  <!-- Second surface normal at Q (approx 195, 137.5) -->
  <line x1="195" y1="137.5" x2="225" y2="95" class="normal" />

  <!-- Light rays -->
  <!-- Incident ray -->
  <line x1="40" y1="170" x2="110" y2="137.5" class="ray" />
  <!-- Refracted ray inside prism -->
  <line x1="110" y1="137.5" x2="195" y2="137.5" class="ray" />
  <!-- Emergent ray -->
  <line x1="195" y1="137.5" x2="265" y2="100" class="ray" />

  <!-- Extension of incident ray (backward) for deviation angle -->
  <line x1="110" y1="137.5" x2="190" y2="98" class="normal" stroke-dasharray="2,3" />

  <!-- Extension of emergent ray (forward) to find D -->
  <line x1="195" y1="137.5" x2="135" y2="68" class="normal" stroke-dasharray="2,3" />

  <!-- Angle Arcs -->
  <!-- Angle of incidence (i) between incident ray and normal -->
  <path d="M 97,119 A 25,25 0 0 1 110,1125" class="angle-arc" />
  <!-- Angle of emergence (e) between emergent ray and normal -->
  <path d="M 210,113 A 25,25 0 0 1 195,1125" class="angle-arc" />
  <!-- Angle of deviation (D) at intersection of extensions -->
  <path d="M 155,95 A 18,18 0 0 1 163,110" class="angle-arc" />

  <!-- Text Labels -->
  <!-- Prism vertices -->
  <text x="142" y="42">A</text>
  <text x="65" y="212">B</text>
  <text x="248" y="212">C</text>

  <!-- Angle labels -->
  <text x="83" y="112">i</text>
  <text x="214" y="112">e</text>
  <text x="168" y="93">D</text>

  <!-- Ray direction arrows -->
  <polygon points="75,153 80,157 73,161" fill="#000" />
  <polygon points="152,137.5 158,135 158,140" fill="#000" />
  <polygon points="230,118 236,115 234,122" fill="#000" />

  <!-- Descriptive labels for clarity -->
  <text x="25" y="185">Incident</text>
  <text x="30" y="200">ray</text>
  
  <text x="260" y="90">Emergent</text>
  <text x="265" y="105">ray</text>
</svg>