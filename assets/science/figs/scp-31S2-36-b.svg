<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    line, path, rect, circle {
      stroke: #000;
      stroke-width: 1.6;
      fill: none;
    }
    text {
      font-family: Arial, sans-serif;
      font-size: 13px;
      fill: #000;
    }
    .label {
      font-size: 12px;
      font-style: italic;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" stroke="none"/>

  <!-- Main Circuit Diagram: Parallel Combination with Cell and Ammeters -->
  <!-- Battery source on the left -->
  <line x1="50" y1="70" x2="50" y2="170" />
  <line x1="42" y1="90" x2="58" y2="90" stroke-width="2.2" />
  <line x1="46" y1="110" x2="54" y2="110" stroke-width="2.2" />
  <line x1="42" y1="130" x2="58" y2="130" stroke-width="2.2" />
  <line x1="46" y1="150" x2="54" y2="150" stroke-width="2.2" />
  
  <text x="22" y="124">+</text>
  <text x="64" y="124">-</text>

  <!-- Top wire from battery to node -->
  <line x1="50" y1="70" x2="160" y2="70" />
  
  <!-- Ammeter A1 in main line -->
  <circle cx="105" cy="70" r="16" />
  <text x="101" y="74" class="label">A</text>
  <text x="108" y="78" font-size="9">1</text>

  <!-- Bottom wire from battery to node -->
  <line x1="50" y1="170" x2="310" y2="170" />
  <line x1="310" y1="170" x2="330" y2="170" />

  <!-- Ammeter A2 in one of the parallel branches (let's place in R3 branch or main return) -->
  <!-- Standard textbook case often places A2 in branch R3 or right before junction -->
  <circle cx="310" cy="120" r="16" />
  <text x="306" y="124" class="label">A</text>
  <text x="313" y="128" font-size="9">2</text>
  
  <line x1="310" y1="70" x2="310" y2="104" />
  <line x1="310" y1="136" x2="310" y2="170" />
  <line x1="160" y1="70" x2="310" y2="70" />

  <!-- Three parallel resistor branches between x = 200 and x = 260 -->
  <!-- Top Branch (R1) -->
  <line x1="160" y1="70" x2="200" y2="70" />
  <path d="M 200 70 l 5 -6 l 10 12 l 10 -12 l 10 12 l 10 -12 l 10 12 l 5 -6" />
  <line x1="260" y1="70" x2="310" y2="70" />
  <text x="223" y="62" class="label">R</text>
  <text x="233" y="65" font-size="9">1</text>

  <!-- Middle Branch (R2) -->
  <line x1="160" y1="70" x2="160" y2="120" />
  <line x1="160" y1="120" x2="200" y2="120" />
  <path d="M 200 120 l 5 -6 l 10 12 l 10 -12 l 10 12 l 10 -12 l 10 12 l 5 -6" />
  <line x1="260" y1="120" x2="310" y2="120" />
  <line x1="310" y1="120" x2="310" y2="70" />
  <text x="223" y="112" class="label">R</text>
  <text x="233" y="115" font-size="9">2</text>

  <!-- Bottom Branch (R3) -->
  <line x1="160" y1="120" x2="160" y2="170" />
  <!-- Wait, let's make three clear vertical drops from top rail to bottom rail -->
  
  <!-- Clearer parallel bus layout: -->
  <!-- Top rail y = 70, Bottom rail y = 170 -->
  <line x1="160" y1="70" x2="160" y2="170" />
  <line x1="290" y1="70" x2="290" y2="170" />

  <!-- Redraw branches vertically between rails y=70 and y=170 at x=190, x=240, x=290? No, let's keep standard horizontal resistors -->
  
  <!-- Let's fix the three parallel branches properly: -->
  <!-- Top rail from 150 to 310 at y=70 -->
  <!-- Bottom rail from 150 to 310 at y=170 -->
  
  <!-- R1 branch at y=80 -->
  <line x1="150" y1="80" x2="190" y2="80" />
  <path d="M 190 80 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 10 l 4 -5" />
  <line x1="250" y1="80" x2="310" y2="80" />
  <text x="215" y="72" class="label">R₁</text>

  <!-- R2 branch at y=120 -->
  <line x1="150" y1="120" x2="190" y2="120" />
  <path d="M 190 120 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 10 l 4 -5" />
  <line x1="250" y1="120" x2="310" y2="120" />
  <text x="215" y="112" class="label">R₂</text>

  <!-- R3 branch at y=160 -->
  <line x1="150" y1="160" x2="190" y2="160" />
  <path d="M 190 160 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 8 10 l 4 -5" />
  <line x1="250" y1="160" x2="310" y2="160" />
  <text x="215" y="152" class="label">R₃</text>

  <!-- Vertical connecting wires -->
  <line x1="150" y1="80" x2="150" y2="160" />
  <line x1="150" y1="80" x2="150" y2="50" />
  <line x1="150" y1="50" x2="310" y2="50" />
  
  <line x1="310" y1="80" x2="310" y2="160" />
  <line x1="310" y1="80" x2="310" y2="50" />

  <!-- Main circuit connections to battery and ammeters -->
  <line x1="50" y1="50" x2="150" y2="50" />
  
  <!-- Ammeter A1 in top wire -->
  <circle cx="95" cy="50" r="14" />
  <text x="90" y="54" class="label">A₁</text>

  <!-- Ammeter A2 in R3 branch or main return -->
  <!-- Let's put A2 right before R3 or in the R3 branch -->
  <circle cx="275" cy="160" r="14" />
  <text x="270" y="164" class="label">A₂</text>
  <!-- adjust R3 line for A2 -->
  <line x1="250" y1="160" x2="261" y2="160" />
  <line x1="289" y1="160" x2="310" y2="160" />

  <!-- Bottom return wire -->
  <line x1="50" y1="200" x2="310" y2="200" />
  <line x1="310" y1="160" x2="310" y2="200" />
  <line x1="50" y1="165" x2="50" y2="200" />

  <!-- Battery at left -->
  <line x1="42" y1="110" x2="58" y2="110" stroke-width="2.2" />
  <line x1="46" y1="122" x2="54" y2="122" stroke-width="2.2" />
  <line x1="42" y1="134" x2="58" y2="134" stroke-width="2.2" />
  <line x1="46" y1="146" x2="54" y2="146" stroke-width="2.2" />
  <line x1="50" y1="50" x2="50" y2="110" />
  <line x1="50" y1="146" x2="50" y2="200" />

  <text x="25" y="132">+</text>
  <text x="63" y="132">-</text>

  <!-- Node dots -->
  <circle cx="150" cy="80" r="2.5" fill="#000" />
  <circle cx="150" cy="120" r="2.5" fill="#000" />
  <circle cx="150" cy="160" r="2.5" fill="#000" />
  <circle cx="310" cy="80" r="2.5" fill="#000" />
  <circle cx="310" cy="120" r="2.5" fill="#000" />
  <circle cx="310" cy="160" r="2.5" fill="#000" />

</svg>