<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    .line { stroke: #000; stroke-width: 1.6; fill: none; }
    .fill-light { fill: #f5f5f5; }
    .text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .bold { font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- Eyeball Outer Shape (Cornea + Sclera) -->
  <!-- Center of eyeball around (230, 130), radius ~70 -->
  <path d="M 160,100 C 160,70 190,60 215,60 C 235,60 280,75 300,100 C 315,120 315,140 300,160 C 280,185 235,200 215,200 C 190,200 160,190 160,160 Z" class="line fill-light" />

  <!-- Cornea Bulge -->
  <path d="M 160,100 C 145,115 145,145 160,160" class="line" />

  <!-- Crystalline Lens -->
  <path d="M 200,98 C 210,115 210,145 200,162 C 195,145 195,115 200,98 Z" class="line" fill="#e0e0e0" />

  <!-- Retina (Back inner wall) -->
  <path d="M 285,85 C 300,110 300,150 285,175" class="line" />

  <!-- Incoming Parallel Rays -->
  <!-- Ray 1 (Top) -->
  <line x1="40" y1="95" x2="145" y2="95" class="line" />
  <!-- Ray 2 (Bottom) -->
  <line x1="40" y1="165" x2="145" y2="165" class="line" />

  <!-- Refracted Rays inside eye converging BEFORE retina -->
  <!-- Lens intersection points roughly (200, 105) and (200, 155) -->
  <line x1="205" y1="105" x2="260" y2="130" class="line" />
  <line x1="205" y1="155" x2="260" y2="130" class="line" />

  <!-- Rays diverging past the focal point inside the eye -->
  <line x1="260" y1="130" x2="295" y2="146" class="line" />
  <line x1="260" y1="130" x2="295" y2="114" class="line" />

  <!-- Principal Axis -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="#000" stroke-width="0.8" stroke-dasharray="4,4" />

  <!-- Labels -->
  <text x="215" y="45" text-anchor="middle" class="text bold">Myopia (Short-sightedness)</text>
  <text x="260" y="148" text-anchor="middle" class="text">Focus</text>
  
  <!-- Indicator dots -->
  <circle cx="260" cy="130" r="2.5" fill="#000" />
</svg>