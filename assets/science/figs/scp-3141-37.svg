<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #000; }
    .label { font-size: 12px; }
  </style>

  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Circuit Wires -->
  <!-- Outer rectangle loop: Left x=80, Right x=320, Top y=60, Bottom y=200 -->
  <line x1="120" y1="60" x2="280" y2="60" stroke="#000" stroke-width="1.6" />
  <line x1="80" y1="100" x2="80" y2="160" stroke="#000" stroke-width="1.6" />
  <line x1="320" y1="60" x2="320" y2="110" stroke="#000" stroke-width="1.6" />
  <line x1="320" y1="150" x2="320" y2="200" stroke="#000" stroke-width="1.6" />
  <line x1="120" y1="200" x2="280" y2="200" stroke="#000" stroke-width="1.6" />

  <!-- Corners to complete the loop -->
  <path d="M 80 100 L 120 60" fill="none" stroke="#000" stroke-width="1.6" />
  <path d="M 80 160 L 120 200" fill="none" stroke="#000" stroke-width="1.6" />
  <path d="M 320 60 L 320 60" fill="none" stroke="#000" stroke-width="1.6" />
  <path d="M 280 60 L 320 60" fill="none" stroke="#000" stroke-width="1.6" />
  <path d="M 280 200 L 320 200" fill="none" stroke="#000" stroke-width="1.6" />

  <!-- Battery (Top branch, centered around x=200) -->
  <line x1="180" y1="60" x2="195" y2="60" stroke="#000" stroke-width="1.6" />
  <line x1="195" y1="48" x2="195" y2="72" stroke="#000" stroke-width="1.6" /> <!-- Long thin positive -->
  <line x1="205" y1="54" x2="205" y2="66" stroke="#000" stroke-width="1.6" style="stroke-width:2.6;" /> <!-- Short thick negative -->
  <line x1="205" y1="60" x2="220" y2="60" stroke="#000" stroke-width="1.6" />

  <!-- Plug Key / Switch (Left branch, centered around y=130) -->
  <line x1="80" y1="100" x2="80" y2="115" stroke="#000" stroke-width="1.6" />
  <circle cx="80" cy="118" r="3" fill="none" stroke="#000" stroke-width="1.6" />
  <line x1="80" y1="121" x2="80" y2="135" stroke="#000" stroke-width="1.6" />
  <circle cx="80" cy="138" r="3" fill="none" stroke="#000" stroke-width="1.6" />
  <line x1="80" y1="141" x2="80" y2="160" stroke="#000" stroke-width="1.6" />
  <!-- Switch open bridge -->
  <path d="M 83 113 Q 95 110 97 125" fill="none" stroke="#000" stroke-width="1.6" />

  <!-- Resistor (Bottom branch, centered around x=200) -->
  <path d="M 170 200 
           L 175 190 L 185 210 
           L 195 190 L 205 210 
           L 215 190 L 225 210 
           L 230 200" 
        fill="none" stroke="#000" stroke-width="1.6" />

  <!-- Ammeter (Right branch, top part around y=130) -->
  <circle cx="320" cy="130" r="20" fill="none" stroke="#000" stroke-width="1.6" />
  <text x="320" y="135" text-anchor="middle" font-size="16">A</text>

  <!-- Voltmeter (Connected across the resistor, parallel from x=150 to x=250) -->
  <!-- Tap points on bottom wire -->
  <circle cx="150" cy="200" r="2" fill="#000" />
  <line x1="150" y1="200" x2="150" y2="230" stroke="#000" stroke-width="1.6" />
  <line x1="150" y1="230" x2="300" y2="230" stroke="#000" stroke-width="1.6" />
  
  <circle cx="250" cy="200" r="2" fill="#000" />
  <line x1="250" y1="200" x2="250" y2="230" stroke="#000" stroke-width="1.6" />

  <!-- Voltmeter circle -->
  <circle cx="200" cy="230" r="20" fill="none" stroke="#000" stroke-width="1.6" />
  <text x="200" y="235" text-anchor="middle" font-size="16">V</text>

  <!-- Labels -->
  <text x="210" y="45" class="label">+  -</text>
  <text x="70" y="132" class="label">K</text>
  <text x="195" y="180" class="label">R</text>

  <!-- Question number indicator -->
  <text x="30" y="30" font-weight="bold">3.</text>
</svg>