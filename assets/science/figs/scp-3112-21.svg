<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #000; }
    .label { font-size: 12px; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff"/>

  <!-- Uniform Magnetic Field Section (Left) -->
  <g transform="translate(20, 30)">
    <!-- Parallel equidistant lines representing uniform magnetic field -->
    <line x1="20" y1="40" x2="140" y2="40" stroke="#000" stroke-width="1.6"/>
    <line x1="20" y1="90" x2="140" y2="90" stroke="#000" stroke-width="1.6"/>
    <line x1="20" y1="140" x2="140" y2="140" stroke="#000" stroke-width="1.6"/>

    <!-- Arrowheads for uniform field lines -->
    <polygon points="90,36 100,40 90,44" fill="#000"/>
    <polygon points="90,86 100,90 90,94" fill="#000"/>
    <polygon points="90,136 100,140 90,144" fill="#000"/>

    <!-- Label -->
    <text x="35" y="185" class="label">Uniform magnetic field</text>
  </g>

  <!-- Divider Line -->
  <line x1="180" y1="20" x2="180" y2="240" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>

  <!-- Non-intersecting Magnetic Field Lines Section (Right) -->
  <g transform="translate(200, 20)">
    <!-- First curve (Line 1) -->
    <path d="M 30 160 C 50 50, 110 50, 150 140" fill="none" stroke="#000" stroke-width="1.6"/>
    <!-- Arrow on curve 1 -->
    <polygon points="85,67 95,62 93,73" fill="#000"/>

    <!-- Second curve (Line 2) passing close but not intersecting -->
    <path d="M 30 200 C 60 90, 130 90, 170 180" fill="none" stroke="#000" stroke-width="1.6"/>
    <!-- Arrow on curve 2 -->
    <polygon points="95,103 105,99 101,110" fill="#000"/>

    <!-- Compass at hypothetical intersection point to show paradox -->
    <g transform="translate(100, 110)">
      <!-- Faint intersection concept indicator -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2"/>
      <!-- Needle 1 -->
      <polygon points="0,-12 3,0 0,12 -3,0" fill="#000"/>
      <!-- Needle 2 (perpendicular-ish to show two directions) -->
      <polygon points="-12,0 0,3 12,0 0,-3" fill="#666"/>
    </g>

    <!-- Labels -->
    <text x="12" y="215" class="label">Non-intersecting</text>
    <text x="18" y="232" class="label">field lines</text>
  </g>
</svg>