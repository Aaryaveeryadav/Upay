<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #000;
    }
    .label {
      font-style: italic;
    }
  </style>

  <!-- White background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- Glass Prism -->
  <!-- Vertices: A(200, 50), B(120, 200), C(280, 200) -->
  <polygon points="200,50 120,200 280,200" fill="none" stroke="#000" stroke-width="1.6" />

  <!-- Incident Ray -->
  <!-- From (70, 140) to interface point on AB (approx 150, 125) -->
  <line x1="70" y1="140" x2="150" y2="125" stroke="#000" stroke-width="1.6" />
  <!-- Arrow on incident ray -->
  <polygon points="115,131 105,127 108,135" fill="#000" />

  <!-- Normal at first surface (AB) -->
  <!-- AB vector: (-80, 150), perpendicular is (150, 80) normalized -->
  <line x1="150" y1="125" x2="195" y2="149" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Refracted/Dispersed Rays inside prism -->
  <!-- From (150, 125) to AC (approx 235, 145) -->
  <!-- Ray 1 (Deviation less - Red, top) -->
  <line x1="150" y1="125" x2="230" y2="135" stroke="#000" stroke-width="1.6" />
  <!-- Ray 2 (Deviation more - Violet, bottom) -->
  <line x1="150" y1="125" x2="230" y2="160" stroke="#000" stroke-width="1.6" />

  <!-- Emergent Rays outside prism -->
  <!-- Ray 1 (top) exiting from (230, 135) to (330, 115) -->
  <line x1="230" y1="135" x2="330" y2="115" stroke="#000" stroke-width="1.6" />
  <!-- Arrow on ray 1 -->
  <polygon points="285,123 275,120 279,127" fill="#000" />

  <!-- Ray 2 (bottom) exiting from (230, 160) to (330, 180) -->
  <line x1="230" y1="160" x2="330" y2="180" stroke="#000" stroke-width="1.6" />
  <!-- Arrow on ray 2 -->
  <polygon points="285,171 279,167 275,174" fill="#000" />

  <!-- Labels -->
  <!-- Ray 1 label -->
  <text x="338" y="118">1</text>
  <!-- Ray 2 label -->
  <text x="338" y="184">2</text>

  <!-- Incident light label -->
  <text x="60" y="160">White light</text>

  <!-- Prism vertices labels (optional, standard for clarity) -->
  <text x="195" y="42" text-anchor="middle" class="label">A</text>
  <text x="105" y="210" class="label">B</text>
  <text x="288" y="210" class="label">C</text>
</svg>