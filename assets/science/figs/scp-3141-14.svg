<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .bold { font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff"/>

  <!-- Title / Heading -->
  <text x="200" y="20" text-anchor="middle" class="bold">Monohybrid Cross: Flower Color in Pea Plants</text>

  <!-- Generation Labels (Left Margin) -->
  <text x="20" y="55" class="bold">Parents:</text>
  <text x="20" y="120" class="bold">F₁ Generation:</text>
  <text x="20" y="185" class="bold">F₂ Generation:</text>

  <!-- PARENTS -->
  <!-- Red Flower Parent -->
  <g transform="translate(110, 50)">
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <path d="M-6,2 Q0,10 6,2" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="20" text-anchor="middle">Red (RR)</text>
  </g>

  <!-- Cross symbol -->
  <text x="165" y="50" text-anchor="middle" class="bold" font-size="16">×</text>

  <!-- White Flower Parent -->
  <g transform="translate(220, 50)">
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <path d="M-6,2 Q0,10 6,2" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="20" text-anchor="middle">White (rr)</text>
  </g>

  <!-- Arrow down to F1 -->
  <line x1="165" y1="65" x2="165" y2="90" stroke="#000" stroke-width="1.6"/>
  <polygon points="165,95 161,88 169,88" fill="#000"/>

  <!-- F1 GENERATION -->
  <g transform="translate(165, 120)">
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <path d="M-6,2 Q0,10 6,2" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="20" text-anchor="middle">All Red (Rr)</text>
    <text x="50" y="2" font-size="10">(30 seeds: 30 Red)</text>
  </g>

  <!-- Arrow down to F2 -->
  <line x1="165" y1="140" x2="165" y2="165" stroke="#000" stroke-width="1.6"/>
  <polygon points="165,170 161,163 169,163" fill="#000"/>
  <text x="175" y="160" font-size="10">Self-pollination</text>

  <!-- F2 GENERATION -->
  <!-- Red Offspring (F2) -->
  <g transform="translate(110, 195)">
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <path d="M-6,2 Q0,10 6,2" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="20" text-anchor="middle">Red</text>
    <text x="0" y="32" text-anchor="middle" font-size="10">(33 plants)</text>
  </g>

  <!-- Ratio symbol -->
  <text x="165" y="205" text-anchor="middle" class="bold">:</text>

  <!-- White Offspring (F2) -->
  <g transform="translate(220, 195)">
    <circle cx="0" cy="-5" r="12" fill="none" stroke="#000" stroke-width="1.6"/>
    <path d="M-6,2 Q0,10 6,2" fill="none" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="20" text-anchor="middle">White</text>
    <text x="0" y="32" text-anchor="middle" font-size="10">(11 plants)</text>
  </g>

  <!-- Phenotypic Ratio note -->
  <text x="310" y="205" font-size="10" class="bold">Ratio ≈ 3 : 1</text>

  <!-- Border Box -->
  <rect x="10" y="10" width="380" height="240" fill="none" stroke="#000" stroke-width="1.6"/>
</svg>