<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Stand / Base -->
  <path d="M 50 230 L 150 230" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 90 230 L 90 140" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Clamp and Bosshead holding Test Tube A -->
  <path d="M 90 140 L 115 140" fill="none" stroke="#000000" stroke-width="1.6" />
  <path d="M 110 130 Q 115 140 110 150" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Test Tube A (slanting) -->
  <!-- Center around (130, 110), rotated -->
  <g transform="rotate(-30, 130, 110)">
    <!-- Test tube outline: width = 24, length = 100 -->
    <rect x="118" y="60" width="24" height="100" rx="12" ry="12" fill="none" stroke="#000000" stroke-width="1.6" />
    <!-- Liquid level inside Test Tube A -->
    <path d="M 119 100 L 141 100 L 141 150 Q 141 160 130 160 Q 119 160 119 150 Z" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" />
    <!-- Solid reactant particles at bottom -->
    <circle cx="125" cy="145" r="3" fill="#000000" />
    <circle cx="135" cy="150" r="2.5" fill="#000000" />
    <circle cx="130" cy="140" r="2" fill="#000000" />
  </g>

  <!-- Cork and Delivery Tube -->
  <!-- Cork in Test Tube A (rotated -30 deg at mouth ~ 130, 65) -->
  <g transform="rotate(-30, 130, 68)">
    <rect x="119" y="55" width="22" height="15" rx="2" ry="2" fill="none" stroke="#000000" stroke-width="1.6" />
  </g>

  <!-- Delivery Tube (Glass tubing going from Test Tube A to Test Tube B) -->
  <path d="M 125 55 
           Q 115 35, 140 35 
           L 260 35 
           Q 285 35, 285 60
           L 285 110" 
        fill="none" stroke="#000000" stroke-width="1.6" stroke-linejoin="round" />

  <!-- Stand for Test Tube B -->
  <path d="M 240 230 L 330 230" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 285 230 L 285 160" fill="none" stroke="#000000" stroke-width="1.6" />
  <path d="M 285 170 L 270 170" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Test Tube B (vertical, containing lime water) -->
  <!-- Center around x=285, y=130 -->
  <rect x="273" y="80" width="24" height="100" rx="12" ry="12" fill="none" stroke="#000000" stroke-width="1.6" />
  
  <!-- Lime water level inside Test Tube B -->
  <path d="M 274 120 L 296 120 L 296 170 Q 296 180 285 180 Q 274 180 274 170 Z" fill="none" stroke="#000000" stroke-width="1.2" />

  <!-- Bubbles in Lime Water -->
  <circle cx="285" cy="150" r="2" fill="none" stroke="#000000" stroke-width="1" />
  <circle cx="282" cy="138" r="1.5" fill="none" stroke="#000000" stroke-width="1" />
  <circle cx="288" cy="132" r="1" fill="none" stroke="#000000" stroke-width="1" />

  <!-- Labels -->
  <text x="75" y="100" font-family="sans-serif" font-size="11" text-anchor="end">Test tube (A)</text>
  <path d="M 80 97 L 105 92" fill="none" stroke="#000000" stroke-width="1" />

  <text x="320" y="100" font-family="sans-serif" font-size="11" text-anchor="start">Test tube (B)</text>
  <path d="M 320 97 L 298 105" fill="none" stroke="#000000" stroke-width="1" />

  <text x="320" y="130" font-family="sans-serif" font-size="11" text-anchor="start">Lime water</text>
  <path d="M 320 127 L 297 135" fill="none" stroke="#000000" stroke-width="1" />

  <text x="180" y="25" font-family="sans-serif" font-size="11" text-anchor="middle">Delivery tube</text>
  <path d="M 180 28 L 180 35" fill="none" stroke="#000000" stroke-width="1" />
</svg>