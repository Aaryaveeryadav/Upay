<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Styles -->
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      fill: #000000;
    }
    .bold-label {
      font-weight: bold;
    }
  </style>

  <!-- Magnetic Field Vectors (West to East, i.e., Left to Right) -->
  <!-- Row 1 -->
  <line x1="50" y1="60" x2="110" y2="60" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="130" y1="60" x2="190" y2="60" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="210" y1="60" x2="270" y2="60" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="290" y1="60" x2="350" y2="60" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Row 2 -->
  <line x1="50" y1="130" x2="110" y2="130" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="130" y1="130" x2="190" y2="130" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="210" y1="130" x2="270" y2="130" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="290" y1="130" x2="350" y2="130" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Row 3 -->
  <line x1="50" y1="200" x2="110" y2="200" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="130" y1="200" x2="190" y2="200" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="210" y1="200" x2="270" y2="200" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="290" y1="200" x2="350" y2="200" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Proton entering vertically downwards -->
  <!-- Trajectory line with downward arrow -->
  <line x1="200" y1="80" x2="200" y2="170" stroke="#000000" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- Proton symbol (+) at the center -->
  <circle cx="200" cy="130" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <text x="200" y="134" text-anchor="middle" class="bold-label">+</text>

  <!-- Labels -->
  <!-- Magnetic Field Label -->
  <text x="345" y="45" text-anchor="end" class="bold-label">Magnetic Field (B)</text>
  <text x="345" y="225" text-anchor="end">West to East</text>

  <!-- Proton / Current Direction Label -->
  <text x="215" y="100">Proton (Vertically downwards)</text>

  <!-- Direction compass indicator (small) -->
  <g transform="translate(60, 50)">
    <text x="0" y="-15" text-anchor="middle" font-size="11">N</text>
    <text x="0" y="25" text-anchor="middle" font-size="11">S</text>
    <text x="-18" y="4" text-anchor="middle" font-size="11">W</text>
    <text x="18" y="4" text-anchor="middle" font-size="11">E</text>
    <line x1="0" y1="-12" x2="0" y2="15" stroke="#000000" stroke-width="1" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#000000" stroke-width="1" />
  </g>

</svg>