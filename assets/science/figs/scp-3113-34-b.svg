<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: sans-serif; font-size: 12px; fill: #000; }
    .label { font-size: 11px; }
  </style>

  <!-- White Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Circuit Wires & Components (Rectangle layout: left, top, right, bottom) -->
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- Top Wire (with Battery and Plug Key) -->
    <!-- From top-left corner (80, 50) to top-right corner (320, 50) -->
    <path d="M 80 50 L 140 50" />
    
    <!-- Battery of 6 cells (spanning x: 140 to 220) -->
    <!-- Cell 1 -->
    <line x1="140" y1="38" x2="140" y2="62" stroke-width="2.2" />
    <line x1="146" y1="44" x2="146" y2="56" />
    <!-- Cell 2 -->
    <line x1="152" y1="38" x2="152" y2="62" stroke-width="2.2" />
    <line x1="158" y1="44" x2="158" y2="56" />
    <!-- Cell 3 -->
    <line x1="164" y1="38" x2="164" y2="62" stroke-width="2.2" />
    <line x1="170" y1="44" x2="170" y2="56" />
    <!-- Cell 4 -->
    <line x1="176" y1="38" x2="176" y2="62" stroke-width="2.2" />
    <line x1="182" y1="44" x2="182" y2="56" />
    <!-- Cell 5 -->
    <line x1="188" y1="38" x2="188" y2="62" stroke-width="2.2" />
    <line x1="194" y1="44" x2="194" y2="56" />
    <!-- Cell 6 -->
    <line x1="200" y1="38" x2="200" y2="62" stroke-width="2.2" />
    <line x1="206" y1="44" x2="206" y2="56" />
    
    <!-- Wire continuation to Key -->
    <path d="M 206 50 L 250 50" />
    
    <!-- Plug Key (Open) at x: 250 to 270 -->
    <circle cx="250" cy="50" r="3" fill="#000" />
    <circle cx="270" cy="50" r="3" fill="#000" />
    <path d="M 270 50 L 320 50" />

    <!-- Right Wire -->
    <path d="M 320 50 L 320 210" />

    <!-- Bottom Wire (with Resistors) -->
    <!-- From bottom-right (320, 210) to bottom-left (80, 210) -->
    <path d="M 320 210 L 280 210" />
    
    <!-- Resistor 1: 18 Ω -->
    <path d="M 280 210 L 285 204 L 295 216 L 305 204 L 315 216 L 325 204 L 335 216 L 340 210" transform="translate(-75, 0)" />
    
    <path d="M 265 210 L 235 210" />

    <!-- Resistor 2: 12 Ω -->
    <path d="M 280 210 L 285 204 L 295 216 L 305 204 L 315 216 L 325 204 L 335 216 L 340 210" transform="translate(-105, 0)" />

    <path d="M 195 210 L 165 210" />

    <!-- Resistor 3: 6 Ω -->
    <path d="M 280 210 L 285 204 L 295 216 L 305 204 L 315 216 L 325 204 L 335 216 L 340 210" transform="translate(-175, 0)" />

    <path d="M 125 210 L 80 210" />

    <!-- Left Wire -->
    <path d="M 80 210 L 80 50" />
  </g>

  <!-- Labels -->
  <!-- Battery Label -->
  <text x="156" y="28" text-anchor="middle" class="label">12 V (6 × 2V)</text>
  <text x="133" y="45" class="label" font-weight="bold">+</text>
  <text x="213" y="45" class="label" font-weight="bold">-</text>

  <!-- Key Label -->
  <text x="260" y="32" text-anchor="middle" class="label">K</text>

  <!-- Resistor Labels -->
  <text x="245" y="195" text-anchor="middle" class="label">18 Ω</text>
  <text x="180" y="195" text-anchor="middle" class="label">12 Ω</text>
  <text x="110" y="195" text-anchor="middle" class="label">6 Ω</text>

  <!-- Optional Current Indicator Arrow -->
  <g stroke="#000" stroke-width="1.2" fill="none">
    <path d="M 95 50 L 105 50" />
    <polygon points="102,47 108,50 102,53" fill="#000" />
    <text x="100" y="65" text-anchor="middle" class="label">I</text>
  </g>

</svg>