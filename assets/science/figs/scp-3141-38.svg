<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 11px;
      fill: #000;
    }
    .line {
      stroke: #000;
      stroke-width: 1.6;
      fill: none;
    }
    .ray {
      stroke: #000;
      stroke-width: 1.2;
      fill: none;
    }
    .dashed {
      stroke-dasharray: 4,4;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Main optical tube / housing (schematic outline) -->
  <path d="M 50,110 L 320,110 L 320,150 L 50,150" class="line" />

  <!-- Primary Mirror (Concave parabolic mirror at the left end) -->
  <path d="M 60,95 Q 45,130 60,165" class="line" stroke-width="2.2" />

  <!-- Secondary Mirror (Plane or convex mirror at an angle near the front) -->
  <line x1="280" y1="120" x2="295" y2="140" class="line" stroke-width="2.2" />

  <!-- Eyepiece tube / Side port housing -->
  <path d="M 275,130 L 275,175" class="line" />
  <path d="M 295,130 L 295,175" class="line" />
  <line x1="265" y1="175" x2="305" y2="175" class="line" />

  <!-- Incoming parallel rays from distant star/object (entering from right, traveling left) -->
  <line x1="370" y1="115" x2="280" y2="115" class="ray" />
  <line x1="370" y1="145" x2="280" y2="145" class="ray" />
  <line x1="370" y1="130" x2="280" y2="130" class="ray" />

  <!-- Reflected rays from primary mirror to secondary mirror -->
  <line x1="280" y1="115" x2="70" y2="123" class="ray" />
  <line x1="280" y1="145" x2="70" y2="137" class="ray" />
  <line x1="280" y1="130" x2="63" y2="130" class="ray" />

  <line x1="70" y1="123" x2="287" y2="130" class="ray" />
  <line x1="70" y1="137" x2="287" y2="130" class="ray" />
  <line x1="63" y1="130" x2="287" y2="130" class="ray" />

  <!-- Reflected rays from secondary mirror down to eyepiece focus -->
  <line x2="287" y2="130" x1="287" y1="130" class="ray" />
  <path d="M 287,130 L 285,160" class="ray" />

  <!-- Labels -->
  <text x="35" y="185">Primary Mirror</text>
  <text x="260" y="105">Secondary Mirror</text>
  <text x="255" y="195">Eyepiece</text>
  <text x="320" y="100">Incoming Light</text>

  <!-- Pointer lines for labels -->
  <path d="M 52,145 Q 40,170 65,177" class="line" stroke-width="0.8" />
  <path d="M 288,125 Q 275,100 258,102" class="line" stroke-width="0.8" />
  <path d="M 275,160 Q 255,170 252,192" class="line" stroke-width="0.8" />
</svg>