<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    line, path, circle {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
    }
    .dashed {
      stroke-dasharray: 4,4;
    }
    text {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" stroke="none"/>

  <!-- Principal Axis -->
  <line x1="20" y1="130" x2="380" y2="130" />

  <!-- Convex Lens -->
  <!-- Lens outline -->
  <path d="M 200,60 Q 215,130 200,200 Q 185,130 200,60" fill="#f4f4f4" />
  
  <!-- Optical Center (O) -->
  <circle cx="200" cy="130" r="2" fill="#000" />
  
  <!-- Foci -->
  <circle cx="130" cy="130" r="2" fill="#000" />
  <text x="127" y="148">F₁</text>
  
  <circle cx="270" cy="130" r="2" fill="#000" />
  <text x="267" y="148">F₂</text>

  <!-- Object -->
  <line x1="90" y1="130" x2="90" y2="80" />
  <polygon points="90,75 86,85 94,85" fill="#000" />
  <text x="83" y="148">Object</text>

  <!-- Image -->
  <line x1="320" y1="130" x2="320" y2="190" />
  <polygon points="320,195 316,185 324,185" fill="#000" />
  <text x="303" y="122">Image</text>

  <!-- Rays -->
  <!-- Ray 1: Parallel to principal axis then through F2 -->
  <line x1="90" y1="80" x2="200" y2="80" />
  <line x1="200" y1="80" x2="320" y2="190" />

  <!-- Ray 2: Through optical center O -->
  <line x1="90" y1="80" x2="320" y2="190" class="dashed" />

  <!-- Labels for Lens -->
  <text x="182" y="45">Convex Lens</text>
</svg>