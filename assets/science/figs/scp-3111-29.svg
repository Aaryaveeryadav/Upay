<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    line, path, rect {
      fill: none;
      stroke: #000000;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    text {
      font-family: sans-serif;
      font-size: 14px;
      fill: #000000;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" stroke="none"/>

  <!-- Parallel equidistant straight lines representing uniform magnetic field -->
  <line x1="60" y1="60" x2="340" y2="60" />
  <line x1="60" y1="110" x2="340" y2="110" />
  <line x1="60" y1="160" x2="340" y2="160" />
  <line x1="60" y1="210" x2="340" y2="210" />

  <!-- Direction arrows on the magnetic field lines -->
  <!-- Top line arrows -->
  <polygon points="135,55 145,60 135,65" fill="#000000" stroke="none"/>
  <polygon points="255,55 265,60 255,65" fill="#000000" stroke="none"/>

  <!-- Second line arrows -->
  <polygon points="135,105 145,110 135,115" fill="#000000" stroke="none"/>
  <polygon points="255,105 265,110 255,115" fill="#000000" stroke="none"/>

  <!-- Third line arrows -->
  <polygon points="135,155 145,160 135,165" fill="#000000" stroke="none"/>
  <polygon points="255,155 265,160 255,165" fill="#000000" stroke="none"/>

  <!-- Bottom line arrows -->
  <polygon points="135,205 145,210 135,215" fill="#000000" stroke="none"/>
  <polygon points="255,205 265,210 255,215" fill="#000000" stroke="none"/>

  <!-- Labels -->
  <text x="175" y="35">Uniform magnetic field</text>
</svg>