<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 12px; font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff"/>

  <!-- Main Circuit Wires (Rectangle loop) -->
  <!-- Top wire with Switch and Ammeter -->
  <line x1="80" y1="50" x2="160" y2="50" stroke="#000" stroke-width="1.6"/>
  <line x1="220" y1="50" x2="320" y2="50" stroke="#000" stroke-width="1.6"/>
  
  <!-- Right vertical wire -->
  <line x1="320" y1="50" x2="320" y2="210" stroke="#000" stroke-width="1.6"/>
  
  <!-- Bottom wire containing Resistance Wire AB -->
  <line x1="80" y1="210" x2="150" y2="210" stroke="#000" stroke-width="1.6"/>
  <line x1="250" y1="210" x2="320" y2="210" stroke="#000" stroke-width="1.6"/>

  <!-- Left vertical wire containing Battery -->
  <line x1="80" y1="50" x2="80" y2="100" stroke="#000" stroke-width="1.6"/>
  <line x1="80" y1="160" x2="80" y2="210" stroke="#000" stroke-width="1.6"/>

  <!-- Battery (4 cells in series) on the left -->
  <g transform="translate(80, 130)">
    <!-- Cell 1 -->
    <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#000" stroke-width="1.8"/>
    <line x1="-6" y1="-24" x2="6" y2="-24" stroke="#000" stroke-width="1.2"/>
    <!-- Cell 2 -->
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#000" stroke-width="1.8"/>
    <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#000" stroke-width="1.2"/>
    <!-- Cell 3 -->
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#000" stroke-width="1.8"/>
    <line x1="-6" y1="16" x2="6" y2="16" stroke="#000" stroke-width="1.2"/>
    <!-- Cell 4 -->
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#000" stroke-width="1.8"/>
    <line x1="-6" y1="36" x2="6" y2="36" stroke="#000" stroke-width="1.2"/>
    
    <text x="18" y="-26">+</text>
    <text x="18" y="34">-</text>
  </g>

  <!-- Plug Key (Open) on top wire -->
  <g transform="translate(190, 50)">
    <circle cx="-10" cy="0" r="2.5" fill="#000"/>
    <circle cx="10" cy="0" r="2.5" fill="#000"/>
    <line x1="-10" y1="0" x2="-20" y2="-12" stroke="#000" stroke-width="1.6"/>
    <line x1="-20" y1="-12" x2="0" y2="-12" stroke="#000" stroke-width="1.6"/>
  </g>

  <!-- Ammeter (A) on top wire -->
  <g transform="translate(270, 50)">
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="4" text-anchor="middle" class="label">A</text>
  </g>

  <!-- Resistance Wire AB at the bottom -->
  <g transform="translate(200, 210)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#000" stroke-width="2"/>
    <!-- Terminal A & B markers -->
    <circle cx="-50" cy="0" r="3" fill="#000"/>
    <circle cx="50" cy="0" r="3" fill="#000"/>
    <text x="-54" y="16" class="label">A</text>
    <text x="46" y="16" class="label">B</text>
  </g>

  <!-- Voltmeter (V) connected across AB -->
  <g transform="translate(200, 150)">
    <!-- Connecting wires to voltmeter -->
    <line x1="-50" y1="60" x2="-50" y2="20" stroke="#000" stroke-width="1.6"/>
    <line x1="50" y1="60" x2="50" y2="20" stroke="#000" stroke-width="1.6"/>
    <line x1="-50" y1="20" x2="-18" y2="20" stroke="#000" stroke-width="1.6"/>
    <line x1="50" y1="20" x2="18" y2="20" stroke="#000" stroke-width="1.6"/>
    
    <!-- Voltmeter Circle -->
    <circle cx="0" cy="20" r="18" fill="#fff" stroke="#000" stroke-width="1.6"/>
    <text x="0" y="24" text-anchor="middle" class="label">V</text>
  </g>

</svg>