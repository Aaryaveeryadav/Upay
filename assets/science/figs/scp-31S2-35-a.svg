<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 10px; font-style: italic; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Sun rays coming from top-left -->
  <line x1="40" y1="40" x2="110" y2="100" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" />
  <line x1="60" y1="30" x2="130" y2="90" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" />
  <text x="35" y="35" class="label">Sunlight</text>

  <!-- Water droplet (large circle) -->
  <circle cx="180" cy="130" r="70" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Incident ray -->
  <line x1="110" y1="100" x2="132" y2="111" stroke="#000000" stroke-width="1.6" />
  <polygon points="126,105 132,111 128,103" fill="#000000" />

  <!-- Refracted ray inside droplet (bending down towards back of droplet) -->
  <line x1="132" y1="111" x2="220" y2="165" stroke="#000000" stroke-width="1.6" />

  <!-- Internal reflected ray (from back to bottom-front) -->
  <line x1="220" y1="165" x2="145" y2="185" stroke="#000000" stroke-width="1.6" />

  <!-- Emergent rays separating into spectrum (Red and Violet) -->
  <!-- Violet ray (bent more, lower) -->
  <line x1="145" y1="185" x2="80" y2="235" stroke="#000000" stroke-width="1.4" />
  <polygon points="90,227 80,235 88,236" fill="#000000" />

  <!-- Red ray (bent less, upper) -->
  <line x1="145" y1="185" x2="70" y2="210" stroke="#000000" stroke-width="1.4" />
  <polygon points="78,204 70,210 79,213" fill="#000000" />

  <!-- Normal lines at points of incidence/internal reflection for scientific accuracy -->
  <line x1="132" y1="111" x2="180" y2="130" stroke="#888888" stroke-width="0.8" stroke-dasharray="2,2" />
  <line x1="145" y1="185" x2="180" y2="130" stroke="#888888" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Labels -->
  <text x="145" y="75" class="label">Water droplet</text>
  
  <!-- Phenomenon step labels -->
  <text x="105" y="85">A. Refraction &amp;</text>
  <text x="105" y="97">Dispersion</text>

  <text x="210" y="145">B. Internal</text>
  <text x="210" y="157">Reflection</text>

  <text x="115" y="205">C. Refraction</text>

  <!-- Spectrum end labels -->
  <text x="50" y="205">Red</text>
  <text x="50" y="242">Violet</text>

  <!-- Observer / ground level indicator -->
  <line x1="20" y1="245" x2="380" y2="245" stroke="#000000" stroke-width="1.6" />
  <text x="310" y="240" class="label">Observer</text>
  <circle cx="330" cy="235" r="3" fill="#000000" />
</svg>