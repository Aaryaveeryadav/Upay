<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .axis { stroke: #000; stroke-width: 1.6; fill: none; }
    .grid { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 2,2; }
    .curve { stroke: #000; stroke-width: 1.6; fill: none; }
    .point { fill: #000; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff"/>

  <!-- Graph Grid / Reference lines -->
  <line x1="50" y1="130" x2="350" y2="130" class="axis" />
  <line x1="200" y1="20" x2="200" y2="240" class="axis" />

  <!-- Grid marks -->
  <line x1="125" y1="20" x2="125" y2="240" class="grid" />
  <line x1="275" y1="20" x2="275" y2="240" class="grid" />
  <line x1="50" y1="55" x2="350" y2="55" class="grid" />
  <line x1="50" y1="205" x2="350" y2="205" class="grid" />

  <!-- Axes Labels -->
  <text x="345" y="145" text-anchor="end">u (cm)</text>
  <text x="190" y="30" text-anchor="end">v (cm)</text>
  <text x="205" y="142">0</text>

  <!-- Scale markings -->
  <text x="125" y="145" text-anchor="middle">-50</text>
  <text x="275" y="145" text-anchor="middle">+50</text>
  <text x="190" y="58" text-anchor="end">+50</text>
  <text x="190" y="208" text-anchor="end">-50</text>

  <!-- Schematic Curve representing v vs u for convex lens -->
  <!-- Passes through (-50, 50), (-37.5, 75), (-30, 150) asymptotically -->
  <path d="M 125,50 Q 160,50 185,15" class="curve" />
  <path d="M 215,245 Q 240,55 275,50" class="curve" />

  <!-- Data points corresponding to observations -->
  <!-- (-50, 50) -> (125, 50) -->
  <circle cx="125" cy="50" r="3" class="point" />
  <!-- (+50, +50) -> (275, 50) -->
  <circle cx="275" cy="50" r="3" class="point" />
  <!-- (-30, +150) -> Out of standard view bounds cleanly, but we can plot (-37.5, 75) -> (147.5, 95) roughly -->
  
  <!-- Labels for key points -->
  <text x="125" y="38" text-anchor="middle">(-50, 50)</text>
  <text x="275" y="38" text-anchor="middle">(50, 50)</text>

  <!-- Title / Figure caption -->
  <text x="200" y="255" text-anchor="middle" font-weight="bold">Variation of image distance (v) with object distance (u)</text>
</svg>