<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Principal Axis -->
  <line x1="20" y1="160" x2="380" y2="160" stroke="#000000" stroke-width="1.6" />

  <!-- Concave Mirror C: f = 30cm, u = 20cm (Object between F and P) -->
  <!-- Let scale: 4 pixels = 1 cm -->
  <!-- Pole P at x = 260, y = 160 -->
  <!-- Focus F at x = 260 - (30*4) = 140 -->
  <!-- Center of Curvature C_pt at x = 260 - (60*4) = 20 -->
  <!-- Object at u = 20cm -> x = 260 - (20*4) = 180, height = 30px -->

  <!-- Mirror Arc -->
  <path d="M 240,100 Q 270,160 240,220" fill="none" stroke="#000000" stroke-width="2" />
  <!-- Mirror Back Hatching -->
  <line x1="245" y1="105" x2="238" y2="112" stroke="#000000" stroke-width="1.2" />
  <line x1="250" y1="120" x2="243" y2="127" stroke="#000000" stroke-width="1.2" />
  <line x1="253" y1="135" x2="246" y2="142" stroke="#000000" stroke-width="1.2" />
  <line x1="254" y1="150" x2="247" y2="157" stroke="#000000" stroke-width="1.2" />
  <line x1="254" y1="165" x2="247" y2="172" stroke="#000000" stroke-width="1.2" />
  <line x1="253" y1="180" x2="246" y2="187" stroke="#000000" stroke-width="1.2" />
  <line x1="250" y1="195" x2="243" y2="202" stroke="#000000" stroke-width="1.2" />
  <line x1="245" y1="210" x2="238" y2="217" stroke="#000000" stroke-width="1.2" />

  <!-- Points on Principal Axis -->
  <!-- Pole P (260, 160) -->
  <circle cx="260" cy="160" r="2" fill="#000000" />
  <text x="256" y="175" font-family="sans-serif" font-size="12">P</text>

  <!-- Focus F (140, 160) -->
  <circle cx="140" cy="160" r="2" fill="#000000" />
  <text x="136" y="175" font-family="sans-serif" font-size="12">F</text>

  <!-- Center of Curvature C (20, 160) -->
  <circle cx="20" cy="160" r="2" fill="#000000" />
  <text x="16" y="175" font-family="sans-serif" font-size="12">C</text>

  <!-- Object at u = 20 cm (x = 180) -->
  <line x1="180" y1="160" x2="180" y2="130" stroke="#000000" stroke-width="1.6" />
  <!-- Arrowhead for Object -->
  <polygon points="180,124 176,132 184,132" fill="#000000" />
  <text x="175" y="155" font-family="sans-serif" font-size="12">Object</text>

  <!-- Virtual Image (u=20, f=30 -> v = +60cm -> x = 260 + 240 = 500 (offscreen), height = magnified) -->
  <!-- Let's plot virtual image correctly: f=30, u=20 -> 1/v + 1/-20 = 1/-30 => 1/v = 1/20 - 1/30 = 1/60 => v = +60cm -->
  <!-- x_image = 260 + (60 * 4) = 500 (too far right, let's adjust visualization bounds or draw conceptually) -->
  <!-- Actually, standard textbook diagram for object between F and P: -->
  <!-- Ray 1: Parallel to principal axis, passes through F -->
  <line x1="180" y1="130" x2="251" y2="130" stroke="#000000" stroke-width="1.2" />
  <polyline points="245,126 252,130 245,134" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- Reflected ray goes divergence through F -->
  <line x1="251" y1="130" x2="350" y2="80" stroke="#000000" stroke-width="1.2" />
  <polyline points="310,101 316,104 310,108" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- Back extrapolation of Ray 1 -->
  <line x1="251" y1="130" x2="80" y2="220" stroke="#000000" stroke-dasharray="4,4" stroke-width="1" />

  <!-- Ray 2: Directed towards C (or via C) -->
  <!-- A ray passing through C hits mirror normally and retraces path -->
  <line x1="180" y1="130" x2="253" y2="195" stroke="#000000" stroke-width="1.2" />
  <polyline points="220,163 226,168 221,173" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- Back extrapolation of Ray 2 -->
  <line x1="253" y1="195" x2="20" y2="70" stroke="#000000" stroke-dasharray="4,4" stroke-width="1" />

  <!-- Intersection for Virtual Image at x = 80 -->
  <!-- Let's position virtual image at x = 80, height from 160 to 90 (magnified, upright) -->
  <line x1="80" y1="160" x2="80" y2="95" stroke="#000000" stroke-dasharray="3,3" stroke-width="1.6" />
  <polygon points="80,90 76,98 84,98" fill="#000000" />
  <text x="65" y="115" font-family="sans-serif" font-size="12">Image</text>

  <!-- Labels for Ray Diagram clarification -->
  <text x="30" y="35" font-family="sans-serif" font-size="12" font-weight="bold">Mirror C Ray Diagram (Virtual, Enlarged Image)</text>
</svg>