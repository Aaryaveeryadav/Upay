<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 11px; font-weight: bold; }
    .line { stroke: #000; stroke-width: 1.6; fill: none; }
    .cell-fill { fill: #fff; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- LEAF CROSS SECTION SCHEMATIC -->
  
  <!-- Upper Cuticle & Epidermis -->
  <path d="M 60,60 Q 200,52 340,60" class="line cell-fill" />
  <path d="M 60,70 Q 200,62 340,70" class="line cell-fill" />
  <!-- Upper Epidermis Cells -->
  <g class="line">
    <line x1="90" y1="60" x2="90" y2="70" />
    <line x1="120" y1="60" x2="120" y2="70" />
    <line x1="150" y1="60" x2="150" y2="70" />
    <line x1="180" y1="60" x2="180" y2="70" />
    <line x1="210" y1="60" x2="210" y2="70" />
    <line x1="240" y1="60" x2="240" y2="70" />
    <line x1="270" y1="60" x2="270" y2="70" />
    <line x1="300" y1="60" x2="300" y2="70" />
  </g>

  <!-- Palisade Mesophyll (A) -->
  <g class="line cell-fill">
    <!-- Elongated cells -->
    <rect x="95" y="70" width="18" height="50" rx="4" />
    <rect x="113" y="70" width="18" height="50" rx="4" />
    <rect x="131" y="70" width="18" height="50" rx="4" />
    <rect x="149" y="70" width="18" height="50" rx="4" />
    <rect x="167" y="70" width="18" height="50" rx="4" />
    <rect x="185" y="70" width="18" height="50" rx="4" />
    <rect x="203" y="70" width="18" height="50" rx="4" />
    <rect x="221" y="70" width="18" height="50" rx="4" />
    <rect x="239" y="70" width="18" height="50" rx="4" />
    <rect x="257" y="70" width="18" height="50" rx="4" />
    <rect x="275" y="70" width="18" height="50" rx="4" />
  </g>

  <!-- Spongy Mesophyll with air spaces -->
  <g class="line cell-fill">
    <circle cx="105" cy="138" r="10" />
    <circle cx="125" cy="135" r="11" />
    <circle cx="145" cy="140" r="10" />
    <circle cx="170" cy="136" r="11" />
    <circle cx="230" cy="138" r="10" />
    <circle cx="250" cy="135" r="11" />
    <circle cx="270" cy="140" r="10" />
    <circle cx="290" cy="137" r="10" />
    
    <circle cx="95" cy="155" r="10" />
    <circle cx="115" cy="158" r="10" />
    <circle cx="275" cy="156" r="10" />
    <circle cx="295" cy="154" r="10" />
  </g>

  <!-- Vascular Bundle (Xylem and Phloem in centre) -->
  <g class="line cell-fill">
    <rect x="180" y="125" width="60" height="35" rx="6" />
    <!-- Phloem (lower part of bundle) -->
    <path d="M 183,148 Q 210,143 237,148 Q 237,158 210,158 Q 183,158 183,148" />
    <!-- Xylem vessels (upper part of bundle, larger circles) -->
    <circle cx="198" cy="135" r="5" />
    <circle cx="212" cy="133" r="6" />
    <circle cx="226" cy="135" r="5" />
  </g>

  <!-- Lower Epidermis & Cuticle -->
  <path d="M 60,170 Q 200,178 340,170" class="line cell-fill" />
  <path d="M 60,180 Q 200,188 340,180" class="line cell-fill" />
  
  <!-- Lower Epidermis Cells & Stoma (B) -->
  <g class="line">
    <line x1="90" y1="170" x2="90" y2="180" />
    <line x1="120" y1="170" x2="120" y2="180" />
    <line x1="150" y1="170" x2="150" y2="180" />
    <line x1="180" y1="170" x2="180" y2="180" />
    <!-- Guard cells for stoma at bottom center -->
    <path d="M 210,170 Q 205,175 210,180 Q 215,175 210,170" />
    <path d="M 220,170 Q 225,175 220,180 Q 215,175 220,170" />
    <!-- Stomatal pore -->
    <line x1="240" y1="170" x2="240" y2="180" />
    <line x1="270" y1="170" x2="270" y2="180" />
    <line x1="300" y1="170" x2="300" y2="180" />
  </g>

  <!-- Air cavity / substomatal cavity -->
  <path d="M 205,160 Q 215,168 225,160" class="line" stroke-dasharray="2,2" />

  <!-- LABELS AND POINTER LINES -->
  <!-- Pointer for A (Palisade mesophyll) -->
  <line x1="140" y1="90" x2="60" y2="90" class="line" />
  <text x="35" y="93" class="label">A</text>

  <!-- Pointer for B (Guard cell / Stoma) -->
  <line x1="210" y1="175" x2="110" y2="215" class="line" />
  <text x="95" y="225" class="label">B</text>

</svg>