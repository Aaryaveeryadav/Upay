<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .line { stroke: #000; stroke-width: 1.6; fill: none; }
    .ray { stroke: #000; stroke-width: 1.2; fill: none; }
    .dashed { stroke: #000; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
    .eye { stroke: #000; stroke-width: 1.6; fill: #fff; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Eyeball Outline (Elongated for Myopia) -->
  <path class="eye" d="M 220 90 C 260 90, 310 110, 310 130 C 310 150, 260 170, 220 170 C 200 170, 190 150, 190 130 C 190 110, 200 90, 220 90 Z" />
  
  <!-- Cornea bulging -->
  <path class="line" d="M 190 115 C 185 130, 185 130, 190 145" />

  <!-- Eye Lens -->
  <path class="line" d="M 215 112 C 220 130, 220 130, 215 148 C 220 130, 220 130, 215 112 Z" fill="#f0f0f0" />

  <!-- Retina (Back inner wall) -->
  <path class="line" d="M 298 112 C 304 125, 304 135, 298 148" />

  <!-- Far Point (Infinity) Object Representation -->
  <text x="35" y="134">O</text>
  <circle cx="45" cy="130" r="2" fill="#000" />
  <path class="line" d="M 45 130 L 40 123 M 45 130 L 40 137" /> <!-- Arrow head -->

  <!-- Light Rays from Far Object entering the eye -->
  <!-- Upper Ray -->
  <path class="ray" d="M 45 130 L 190 112" />
  <!-- Lower Ray -->
  <path class="ray" d="M 45 130 L 190 148" />

  <!-- Refracted Rays converging BEFORE the retina -->
  <!-- Upper Ray refraction -->
  <path class="ray" d="M 218 123 L 265 135" />
  <!-- Lower Ray refraction -->
  <path class="ray" d="M 218 137 L 265 125" />

  <!-- Focal Point / Intersection Point (in front of retina) -->
  <circle cx="265" cy="130" r="2.5" fill="#000" />

  <!-- Rays continuing past focus to retina (diverging/crossing) -->
  <path class="ray" d="M 265 135 L 301 144" />
  <path class="ray" d="M 265 125 L 301 116" />

  <!-- Principal Axis -->
  <line x1="30" y1="130" x2="330" y2="130" stroke="#000" stroke-width="0.8" stroke-dasharray="6,4" />

  <!-- Labels -->
  <text x="250" y="155">Focus</text>
  <text x="290" y="175">Retina</text>
  <text x="200" y="80">Myopic eye</text>

  <!-- Vertical Indicator for Retina vs Focus -->
  <line x1="265" y1="133" x2="265" y2="145" class="dashed" />
  <line x1="300" y1="133" x2="300" y2="160" class="dashed" />

</svg>