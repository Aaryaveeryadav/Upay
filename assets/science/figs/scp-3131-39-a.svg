<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    line, path, rect, circle {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
    }
    text {
      font-family: Arial, sans-serif;
      font-size: 11px;
      fill: #000000;
      text-anchor: middle;
    }
    .bold-text {
      font-weight: bold;
    }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" stroke="none" />

  <!-- Main Circuit Wires -->
  <!-- Top rail -->
  <line x1="40" y1="50" x2="360" y2="50" />
  <!-- Bottom rail -->
  <line x1="40" y1="210" x2="360" y2="210" />

  <!-- AC Source (center left) -->
  <circle cx="40" cy="130" r="18" fill="#ffffff" />
  <text x="40" y="126" class="bold-text">~</text>
  <text x="40" y="142" font-size="9">220V</text>
  
  <line x1="40" y1="50" x2="40" y2="112" />
  <line x1="40" y1="148" x2="40" y2="210" />

  <!-- Main Switch K1 (on top rail) -->
  <line x1="100" y1="50" x2="115" y2="50" />
  <line x1="135" y1="50" x2="150" y2="50" />
  <!-- Switch blade K1 open -->
  <line x1="115" y1="50" x2="132" y2="38" />
  <circle cx="115" cy="50" r="2" fill="#000" />
  <circle cx="135" cy="50" r="2" fill="#000" />
  <text x="125" y="28" class="bold-text">K₁</text>

  <!-- Branch for Bulb A (Leftmost vertical branch) -->
  <line x1="170" y1="50" x2="170" y2="90" />
  <!-- Bulb A symbol (circle with cross) -->
  <circle cx="170" cy="115" r="15" />
  <line x1="159" y1="104" x2="181" y2="126" />
  <line x1="159" y1="126" x2="181" y2="104" />
  <line x1="170" y1="140" x2="170" y2="210" />
  <text x="170" y="156" class="bold-text">A</text>
  <text x="170" y="168" font-size="9">22W, 220V</text>

  <!-- Parallel Group for B, C, D, E (Right side) -->
  <!-- Bus line down to parallel network -->
  <line x1="240" y1="50" x2="350" y2="50" />
  <line x1="240" y1="210" x2="350" y2="210" />

  <!-- Switch K2 on the parallel block feed -->
  <line x1="260" y1="50" x2="275" y2="50" />
  <line x1="295" y1="50" x2="310" y2="50" />
  <line x1="275" y1="50" x2="292" y2="38" />
  <circle cx="275" cy="50" r="2" fill="#000" />
  <circle cx="295" cy="50" r="2" fill="#000" />
  <text x="285" y="28" class="bold-text">K₂</text>

  <!-- 4 Parallel Branches for B, C, D, E -->
  <!-- We'll space them at x = 220, 255, 290, 325 along the parallel rails -->
  <!-- Let's adjust exact X coordinates for 4 bulbs: 215, 250, 285, 320 -->

  <!-- Bulb B -->
  <line x1="215" y1="50" x2="215" y2="95" />
  <circle cx="215" cy="115" r="14" />
  <line x1="205" y1="105" x2="225" y2="125" />
  <line x1="205" y1="125" x2="225" y2="105" />
  <line x1="215" y1="135" x2="215" y2="210" />
  <text x="215" y="152" class="bold-text">B</text>
  <text x="215" y="163" font-size="8">11W, 55V</text>

  <!-- Bulb C -->
  <line x1="250" y1="50" x2="250" y2="95" />
  <circle cx="250" cy="115" r="14" />
  <line x1="240" y1="105" x2="260" y2="125" />
  <line x1="240" y1="125" x2="260" y2="105" />
  <line x1="250" y1="135" x2="250" y2="210" />
  <text x="250" y="152" class="bold-text">C</text>
  <text x="250" y="163" font-size="8">11W, 55V</text>

  <!-- Bulb D -->
  <line x1="285" y1="50" x2="285" y2="95" />
  <circle cx="285" cy="115" r="14" />
  <line x1="275" y1="105" x2="295" y2="125" />
  <line x1="275" y1="125" x2="295" y2="105" />
  <line x1="285" y1="135" x2="285" y2="210" />
  <text x="285" y="152" class="bold-text">D</text>
  <text x="285" y="163" font-size="8">11W, 55V</text>

  <!-- Bulb E -->
  <line x1="320" y1="50" x2="320" y2="95" />
  <circle cx="320" cy="115" r="14" />
  <line x1="310" y1="105" x2="330" y2="125" />
  <line x1="310" y1="125" x2="330" y2="105" />
  <line x1="320" y1="135" x2="320" y2="210" />
  <text x="320" y="152" class="bold-text">E</text>
  <text x="320" y="163" font-size="8">11W, 55V</text>

</svg>