<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Styles for textbook-style thin black lines and clear text -->
  <style>
    .line { stroke: #000000; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashed { stroke: #000000; stroke-width: 1.2; fill: none; stroke-dasharray: 4,4; }
    .solid-fill { fill: #000000; stroke: #000000; stroke-width: 1.6; }
    .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .sublabel { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; text-anchor: middle; }
  </style>

  <!-- ==================== CASE P ==================== -->
  <g transform="translate(0, 0)">
    <!-- Container/Beaker P -->
    <path class="line" d="M 45,40 L 45,160 Q 45,170 55,170 L 85,170 Q 95,170 95,160 L 95,40" />
    <!-- Liquid level -->
    <path class="line" d="M 46,75 L 94,75" />
    
    <!-- Object P (Submerged block with spring balance or thread) -->
    <path class="line" d="M 60,50 L 80,50 L 80,75 L 60,75 Z" />
    <!-- Thread -->
    <line class="line" x1="70" y1="30" x2="70" y2="50" />
    <!-- Support hook -->
    <path class="line" d="M 65,30 Q 70,25 75,30" />

    <!-- Label P -->
    <text x="70" y="200" class="label">Case P</text>
  </g>

  <!-- ==================== CASE Q ==================== -->
  <g transform="translate(0, 0)">
    <!-- Container/Beaker Q -->
    <path class="line" d="M 165,40 L 165,160 Q 165,170 175,170 L 205,170 Q 215,170 215,160 L 215,40" />
    <!-- Liquid level (higher than P, or object differently submerged) -->
    <path class="line" d="M 166,65 L 214,65" />
    
    <!-- Object Q -->
    <path class="line" d="M 180,45 L 200,45 L 200,75 L 180,75 Z" />
    <!-- Thread -->
    <line class="line" x1="190" y1="25" x2="190" y2="45" />
    <!-- Support hook -->
    <path class="line" d="M 185,25 Q 190,20 195,25" />

    <!-- Label Q -->
    <text x="190" y="200" class="label">Case Q</text>
  </g>

  <!-- ==================== CASE R ==================== -->
  <g transform="translate(0, 0)">
    <!-- Container/Beaker R -->
    <path class="line" d="M 285,40 L 285,160 Q 285,170 295,170 L 325,170 Q 335,170 335,160 L 335,40" />
    <!-- Liquid level -->
    <path class="line" d="M 286,90 L 334,90" />
    
    <!-- Object R -->
    <path class="line" d="M 300,70 L 320,70 L 320,105 L 300,105 Z" />
    <!-- Thread -->
    <line class="line" x1="310" y1="45" x2="310" y2="70" />
    <!-- Support hook -->
    <path class="line" d="M 305,45 Q 310,40 315,45" />

    <!-- Label R -->
    <text x="310" y="200" class="label">Case R</text>
  </g>

</svg>