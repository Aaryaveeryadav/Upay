<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    line, path, circle { fill: none; stroke: #000; stroke-width: 1.6; }
    text { font-family: sans-serif; font-size: 11px; fill: #000; }
    .axis { stroke-dasharray: 4,4; stroke-width: 1; }
    .ray { stroke-width: 1.4; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- Principal Axis -->
  <line x1="20" y1="150" x2="380" y2="150" />

  <!-- Concave Mirror C (Mirror C from table: f = 30 cm, object at 20 cm -> translated to diagram scale) -->
  <!-- Let Pole P be at x = 260, F at x = 180 (f=80px), C at x = 100 (R=160px) -->
  <!-- Mirror curved surface -->
  <path d="M 260,80 Q 245,150 260,220" />
  <!-- Back hatching of mirror -->
  <line x1="260" y1="80" x2="270" y2="73" />
  <line x1="263" y1="95" x2="273" y2="88" />
  <line x1="265" y1="110" x2="275" y2="103" />
  <line x1="266" y1="125" x2="276" y2="118" />
  <line x1="267" y1="140" x2="277" y2="133" />
  <line x1="267" y1="155" x2="277" y2="148" />
  <line x1="266" y1="170" x2="276" y2="163" />
  <line x1="265" y1="185" x2="275" y2="178" />
  <line x1="263" y1="200" x2="273" y2="193" />
  <line x1="260" y1="215" x2="270" y2="208" />

  <!-- Points on Principal Axis -->
  <!-- Pole P (260, 150) -->
  <circle cx="260" cy="150" r="2" fill="#000" />
  <text x="256" y="165">P</text>

  <!-- Focus F (180, 150) -> f = 80px -->
  <circle cx="180" cy="150" r="2" fill="#000" />
  <text x="176" y="165">F</text>

  <!-- Center of Curvature C (100, 150) -> R = 160px -->
  <circle cx="100" cy="150" r="2" fill="#000" />
  <text x="96" y="165">C</text>

  <!-- Object AB placed between F and P (e.g., at x = 210, object distance u = 50px) -->
  <line x1="210" y1="150" x2="210" y2="110" />
  <polygon points="207,115 210,105 213,115" fill="#000" />
  <text x="205" y="145">A</text>
  <text x="212" y="145">B</text>
  <text x="203" y="100">Object</text>

  <!-- Virtual Image A'B' behind the mirror (e.g., at x = 340) -->
  <line x1="340" y1="150" x2="340" y2="70" stroke-dasharray="3,3" />
  <polygon points="337,78 340,68 343,78" fill="#000" stroke-dasharray="none" />
  <text x="332" y="145">A'</text>
  <text x="345" y="145">B'</text>
  <text x="325" y="60">Virtual Image</text>

  <!-- Ray 1: Incident parallel to principal axis, reflects through F -->
  <line x1="210" y1="110" x2="258" y2="110" class="ray" />
  <polygon points="230,107 238,110 230,113" fill="#000" />
  <!-- Reflected ray diverges from F -->
  <line x1="258" y1="110" x2="330" y2="65" class="ray" />
  <polygon points="290,87 296,84 292,92" fill="#000" />
  <!-- Backward extension of reflected ray -->
  <line x1="258" y1="110" x2="340" y2="70" stroke-dasharray="4,4" />

  <!-- Ray 2: Incident towards Center of Curvature C reflects back along same path -->
  <line x1="210" y1="110" x2="258" y2="150" class="ray" />
  <polygon points="230,126 237,132 233,123" fill="#000" />
  <!-- Reflected ray -->
  <line x1="258" y1="150" x2="350" y2="210" class="ray" />
  <polygon points="310,183 305,178 313,178" fill="#000" />
  <!-- Backward extension of reflected ray -->
  <line x1="258" y1="150" x2="340" y2="70" stroke-dasharray="4,4" />

  <!-- Title/Caption -->
  <text x="110" y="240" font-weight="bold">Ray Diagram for Concave Mirror (Case C: Object between P and F)</text>
</svg>