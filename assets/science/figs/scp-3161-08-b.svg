<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <!-- White background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Styles for textbook-like rendering -->
  <style>
    text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      fill: #000000;
    }
    .bold {
      font-weight: bold;
    }
    .line {
      stroke: #000000;
      stroke-width: 1.6;
      fill: none;
    }
    .box {
      stroke: #000000;
      stroke-width: 1.6;
      fill: #ffffff;
    }
  </style>

  <!-- Title / Header -->
  <text x="200" y="25" text-anchor="middle" class="bold">Cross: Tall plant (Tt) × Short plant (tt)</text>

  <!-- Parents Generation -->
  <text x="40" y="55" class="bold">Parents:</text>
  <rect x="120" y="40" width="50" height="30" class="box" />
  <text x="145" y="60" text-anchor="middle" class="bold">Tt</text>
  <text x="180" y="60" text-anchor="middle" class="bold">×</text>
  <rect x="195" y="40" width="50" height="30" class="box" />
  <text x="220" y="60" text-anchor="middle" class="bold">tt</text>
  <text x="260" y="55">(Tall)</text>
  <text x="325" y="55">(Short)</text>

  <!-- Down arrow 1 -->
  <line x1="145" y1="70" x2="145" y2="88" class="line" />
  <polygon points="145,93 141,85 149,85" fill="#000000" />
  <line x1="220" y1="70" x2="220" y2="88" class="line" />
  <polygon points="220,93 216,85 224,85" fill="#000000" />

  <!-- Gametes -->
  <text x="40" y="112" class="bold">Gametes:</text>
  <circle cx="135" cy="108" r="14" class="box" />
  <text x="135" y="113" text-anchor="middle">T</text>
  <circle cx="160" cy="108" r="14" class="box" />
  <text x="160" y="113" text-anchor="middle">t</text>

  <circle cx="210" cy="108" r="14" class="box" />
  <text x="210" y="113" text-anchor="middle">t</text>
  <circle cx="235" cy="108" r="14" class="box" />
  <text x="235" y="113" text-anchor="middle">t</text>

  <!-- Down arrow 2 -->
  <line x1="147" y1="122" x2="147" y2="140" class="line" />
  <polygon points="147,145 143,137 151,137" fill="#000000" />
  <line x1="222" y1="122" x2="222" y2="140" class="line" />
  <polygon points="222,145 218,137 226,137" fill="#000000" />

  <!-- F1 Generation -->
  <text x="40" y="165" class="bold">F<tspan font-size="10px" dy="3">1</tspan><tspan dy="-3"> Generation:</tspan></text>
  
  <rect x="122" y="152" width="50" height="26" class="box" />
  <text x="147" y="169" text-anchor="middle" class="bold">Tt</text>
  <text x="185" y="169">(Tall)</text>

  <rect x="230" y="152" width="50" height="26" class="box" />
  <text x="255" y="169" text-anchor="middle" class="bold">tt</text>
  <text x="293" y="169">(Short)</text>

  <!-- Result Summary / Ratio -->
  <line x1="30" y1="190" x2="370" y2="190" stroke="#000000" stroke-dasharray="4,4" stroke-width="1" />
  
  <text x="40" y="215" class="bold">Result in F<tspan font-size="10px" dy="3">1</tspan><tspan dy="-3"> Generation:</tspan></text>
  <text x="40" y="238">Phenotypic Ratio: 1 Tall : 1 Short (1 : 1)</text>
  <text x="40" y="255">Genotypic Ratio: 1 Tt : 1 tt (1 : 1)</text>
</svg>