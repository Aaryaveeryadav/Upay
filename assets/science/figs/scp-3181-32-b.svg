<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: sans-serif; font-size: 11px; fill: #000; }
    .label { font-size: 10px; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- Sunlight Rays (Parallel incoming rays from top-left) -->
  <line x1="40" y1="40" x2="110" y2="105" stroke="#000" stroke-width="1.6" />
  <line x1="60" y1="30" x2="130" y2="95" stroke="#000" stroke-width="1.6" />
  
  <!-- Water Droplet (Sphere) -->
  <!-- Center at (160, 130), radius 70 -->
  <circle cx="160" cy="130" r="70" fill="none" stroke="#000" stroke-width="1.6" />

  <!-- INTERNAL PATHS -->
  <!-- Refraction at entry (approx x=110, y=95 to x=180, y=185) -->
  <line x1="110" y1="105" x2="200" y2="175" stroke="#000" stroke-width="1.6" />
  <line x1="130" y1="95" x2="215" y2="155" stroke="#000" stroke-width="1.6" />

  <!-- Internal Reflection at back of droplet (approx x=200, y=175 to x=125, y=185) -->
  <line x1="200" y1="175" x2="135" y2="175" stroke="#000" stroke-width="1.6" />
  <line x1="215" y1="155" x2="145" y2="160" stroke="#000" stroke-width="1.6" />

  <!-- Refraction and dispersion exiting droplet towards observer -->
  <!-- Red ray (upper) -->
  <line x1="135" y1="175" x2="80" y2="230" stroke="#000" stroke-width="1.6" />
  <!-- Violet ray (lower) -->
  <line x1="145" y1="160" x2="70" y2="210" stroke="#000" stroke-width="1.6" />

  <!-- Normals / Optical aids (Dashed lines for refraction center) -->
  <circle cx="160" cy="130" r="2" fill="#000" />

  <!-- Labels -->
  <text x="30" y="25" class="label">Sunlight</text>
  <text x="135" y="65" class="label">Water droplet</text>
  
  <!-- Process steps indicators inside droplet area -->
  <text x="130" y="130" class="label">1. Refraction</text>
  <text x="160" y="195" class="label">2. Internal Reflection</text>
  <text x="85" y="195" class="label">3. Dispersion</text>

  <!-- Emerging spectrum bracket/label -->
  <text x="35" y="240" class="label">Red</text>
  <text x="35" y="220" class="label">Violet</text>
  <path d="M 65 208 Q 60 220 65 232" fill="none" stroke="#000" stroke-width="1.2" />

  <!-- Observer / Eye level indicator -->
  <path d="M 45 220 L 20 225 L 45 230" fill="none" stroke="#000" stroke-width="1.2" />
  <text x="10" y="245" class="label">Observer</text>

</svg>