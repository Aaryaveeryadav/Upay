<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000; }
    .bold { font-weight: bold; }
  </style>

  <!-- Background -->
  <rect width="400" height="260" fill="#ffffff" />

  <!-- ==================== PART (i): TWO BAR MAGNETS ==================== -->
  
  <!-- Magnet X -->
  <rect x="50" y="35" width="60" height="25" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <line x1="80" y1="35" x2="80" y2="60" stroke="#000000" stroke-width="1.6" />
  <text x="62" y="52" class="bold">N</text>
  <text x="92" y="52" class="bold">S</text>
  <text x="73" y="25" class="bold">X</text>

  <!-- Magnet Y -->
  <rect x="150" y="35" width="60" height="25" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <line x1="180" y1="35" x2="180" y2="60" stroke="#000000" stroke-width="1.6" />
  <text x="162" y="52" class="bold">N</text>
  <text x="192" y="52" class="bold">S</text>
  <text x="173" y="25" class="bold">Y</text>

  <!-- Magnetic field lines between X (S, at x=110) and Y (N, at x=150) -->
  <!-- Facing poles are S and N -> Attraction (lines connect S to N) -->
  <path d="M 110,42 Q 130,25 150,42" fill="none" stroke="#000000" stroke-width="1.2" />
  <polygon points="133,29 138,33 133,37" fill="#000000" />

  <path d="M 110,53 Q 130,70 150,53" fill="none" stroke="#000000" stroke-width="1.2" />
  <polygon points="127,63 133,67 137,63" fill="#000000" />

  <!-- Outer field lines for X -->
  <path d="M 50,47 C 30,47 20,20 65,20 C 70,20 75,22 80,22" fill="none" stroke="#000000" stroke-width="1.2" />
  <polygon points="53,30 49,35 56,36" fill="#000000" />

  <!-- Outer field lines for Y -->
  <path d="M 210,47 C 230,47 240,20 195,20 C 190,20 185,22 180,22" fill="none" stroke="#000000" stroke-width="1.2" />
  <polygon points="207,30 211,35 204,36" fill="#000000" />

  <!-- Divider line -->
  <line x1="260" y1="15" x2="260" y2="245" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== PART (ii): HORSESHOE MAGNET & CONDUCTOR ==================== -->

  <!-- Horseshoe Magnet (Side Profile / C-shape representing poles) -->
  <!-- Top Pole (North) -->
  <path d="M 300,90 L 350,90 L 350,130 L 300,130 Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <text x="321" y="113" class="bold">N</text>

  <!-- Bottom Pole (South) -->
  <path d="M 300,160 L 350,160 L 350,200 L 300,200 Z" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <text x="322" y="183" class="bold">S</text>

  <!-- Back yoke connecting poles -->
  <path d="M 350,80 L 375,80 L 375,210 L 350,210" fill="none" stroke="#000000" stroke-width="1.6" />

  <!-- Magnetic field arrow pointing down (N to S) -->
  <line x1="325" y1="135" x2="325" y2="155" stroke="#000000" stroke-width="1.4" />
  <polygon points="325,157 321,149 329,149" fill="#000000" />

  <!-- Suspended Conductor (Cross-section circle representing wire going into/out of page) -->
  <circle cx="295" cy="145" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <!-- Current indicator: dot inside circle (out of page) -->
  <circle cx="295" cy="145" r="2.5" fill="#000000" />

  <!-- Displacement Arrow (towards left) -->
  <line x1="280" y1="145" x2="255" y2="145" stroke="#000000" stroke-width="1.6" />
  <polygon points="252,145 260,141 260,149" fill="#000000" />
  <text x="253" y="132">Motion</text>

  <!-- Support string / connection for conductor -->
  <line x1="295" y1="90" x2="295" y2="137" stroke="#000000" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Labels for Sub-questions -->
  <text x="15" y="95" class="bold">(i)</text>
  <text x="35" y="95">Magnet X (S pole) faces</text>
  <text x="35" y="112">Magnet Y (N pole).</text>
  <text x="35" y="130" class="bold">Result:</text>
  <text x="75" y="130">Attraction.</text>

  <text x="15" y="165" class="bold">(ii)</text>
  <text x="35" y="165">Conductor displaced left</text>
  <text x="35" y="182">by Fleming's Left-Hand Rule.</text>
  <text x="35" y="202">(I) Inc. current &#8594; <tspan class="bold">More disp.</tspan></text>
  <text x="35" y="220">(II) Stronger mag. &#8594; <tspan class="bold">More disp.</tspan></text>
  <text x="35" y="238">(III) Rev. current &#8594; <tspan class="bold">Disp. right</tspan></text>

</svg>