<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <style>
    text { font-family: Arial, sans-serif; font-size: 13px; fill: #000; }
    .bold { font-weight: bold; }
  </style>
  
  <!-- White Background -->
  <rect width="400" height="260" fill="#fff" />

  <!-- Circuit Diagram -->
  <!-- Main loop rectangle: (60, 50) to (340, 180) -->
  
  <!-- Top wire with Switch and Ammeter -->
  <line x1="60" y1="50" x2="130" y2="50" stroke="#000" stroke-width="1.6" />
  <!-- Switch (open) -->
  <line x1="130" y1="50" x2="140" y2="50" stroke="#000" stroke-width="1.6" />
  <line x1="140" y1="50" x2="165" y2="38" stroke="#000" stroke-width="1.6" />
  <line x1="165" y1="50" x2="175" y2="50" stroke="#000" stroke-width="1.6" />
  <text x="148" y="33">K</text>
  
  <line x1="175" y1="50" x2="230" y2="50" stroke="#000" stroke-width="1.6" />
  <!-- Ammeter (A) -->
  <circle cx="250" cy="50" r="20" fill="none" stroke="#000" stroke-width="1.6" />
  <text x="245" y="55" class="bold">A</text>
  <line x1="270" y1="50" x2="340" y2="50" stroke="#000" stroke-width="1.6" />

  <!-- Right vertical wire -->
  <line x1="340" y1="50" x2="340" y2="180" stroke="#000" stroke-width="1.6" />

  <!-- Bottom wire with Battery -->
  <line x1="235" y1="180" x2="340" y2="180" stroke="#000" stroke-width="1.6" />
  <!-- Battery symbol (3 cells) -->
  <line x1="220" y1="180" x2="235" y2="180" stroke="#000" stroke-width="1.6" />
  <!-- Cell 1 -->
  <line x1="220" y1="168" x2="220" y2="192" stroke="#000" stroke-width="2.2" />
  <line x1="214" y1="173" x2="214" y2="187" stroke="#000" stroke-width="1.6" />
  <!-- Cell 2 -->
  <line x1="208" y1="168" x2="208" y2="192" stroke="#000" stroke-width="2.2" />
  <line x1="202" y1="173" x2="202" y2="187" stroke="#000" stroke-width="1.6" />
  <!-- Cell 3 -->
  <line x1="196" y1="168" x2="196" y2="192" stroke="#000" stroke-width="2.2" />
  <line x1="185" y1="180" x2="196" y2="180" stroke="#000" stroke-width="1.6" />
  <text x="183" y="160">+</text>
  <text x="222" y="160">-</text>

  <line x1="60" y1="180" x2="185" y2="180" stroke="#000" stroke-width="1.6" />

  <!-- Left vertical wire -->
  <line x1="60" y1="50" x2="60" y2="180" stroke="#000" stroke-width="1.6" />

  <!-- Parallel Branch 1 (R1 with Voltmeter across it) -->
  <!-- We need two parallel branches between x = 100 and x = 300 (approx) -->
  <!-- Let's redraw the inner network clearly -->
  
  <!-- Clear middle section and replace with proper parallel network -->
  <rect x="58" y="48" width="284" height="134" fill="#fff" />
  
  <!-- Outer loop rewrite -->
  <!-- Top wire -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#000" stroke-width="1.6" />
  <!-- Switch -->
  <line x1="140" y1="60" x2="150" y2="60" stroke="#000" stroke-width="1.6" />
  <line x1="150" y1="60" x2="175" y2="48" stroke="#000" stroke-width="1.6" />
  <line x1="175" y1="60" x2="190" y2="60" stroke="#000" stroke-width="1.6" />
  <text x="157" y="44">K</text>
  
  <line x1="190" y1="60" x2="230" y2="60" stroke="#000" stroke-width="1.6" />
  <!-- Ammeter -->
  <circle cx="250" cy="60" r="18" fill="none" stroke="#000" stroke-width="1.6" />
  <text x="245" y="65" class="bold">A</text>
  <line x1="268" y1="60" x2="340" y2="60" stroke="#000" stroke-width="1.6" />

  <!-- Right vertical -->
  <line x1="340" y1="60" x2="340" y2="200" stroke="#000" stroke-width="1.6" />

  <!-- Bottom wire with battery -->
  <line x1="230" y1="200" x2="340" y2="200" stroke="#000" stroke-width="1.6" />
  
  <line x1="215" y1="200" x2="230" y2="200" stroke="#000" stroke-width="1.6" />
  <line x1="215" y1="188" x2="215" y2="212" stroke="#000" stroke-width="2" />
  <line x1="208" y1="193" x2="208" y2="207" stroke="#000" stroke-width="1.6" />
  <line x1="201" y1="188" x2="201" y2="212" stroke="#000" stroke-width="2" />
  <line x1="194" y1="193" x2="194" y2="207" stroke="#000" stroke-width="1.6" />
  <line x1="170" y1="200" x2="194" y2="200" stroke="#000" stroke-width="1.6" />
  <text x="172" y="185">+</text>
  <text x="218" y="185">-</text>

  <line x1="60" y1="200" x2="170" y2="200" stroke="#000" stroke-width="1.6" />
  <!-- Left vertical -->
  <line x1="60" y1="60" x2="60" y2="200" stroke="#000" stroke-width="1.6" />

  <!-- Parallel Branches for R1 and R2 -->
  <!-- Junctions at x = 100 and x = 300 -->
  <line x1="60" y1="130" x2="100" y2="130" stroke="#000" stroke-width="1.6" />
  <line x1="300" y1="130" x2="340" y2="130" stroke="#000" stroke-width="1.6" />

  <line x1="100" y1="60" x2="100" y2="200" stroke="#000" stroke-width="1.6" />
  <line x1="300" y1="60" x2="300" y2="200" stroke="#000" stroke-width="1.6" />

  <!-- Top branch (Resistor R1) -->
  <line x1="100" y1="95" x2="170" y2="95" stroke="#000" stroke-width="1.6" />
  <!-- Resistor R1 zig-zag -->
  <path d="M 170,95 l 5,-8 l 10,16 l 10,-16 l 10,16 l 10,-16 l 10,16 l 5,-8" fill="none" stroke="#000" stroke-width="1.6" />
  <line x1="230" y1="95" x2="300" y2="95" stroke="#000" stroke-width="1.6" />
  <text x="195" y="80" class="bold">R</text><text x="205" y="83" style="font-size: 10px;">1</text>

  <!-- Voltmeter V across R1 -->
  <path d="M 150,95 L 150,115 L 235,115 L 235,95" fill="none" stroke="#000" stroke-width="1.6" />
  <circle cx="192" cy="115" r="16" fill="none" stroke="#000" stroke-width="1.6" />
  <text x="187" y="120" class="bold">V</text>

  <!-- Bottom branch (Resistor R2) -->
  <line x1="100" y1="165" x2="170" y2="165" stroke="#000" stroke-width="1.6" />
  <!-- Resistor R2 zig-zag -->
  <path d="M 170,165 l 5,-8 l 10,16 l 10,-16 l 10,16 l 10,-16 l 10,16 l 5,-8" fill="none" stroke="#000" stroke-width="1.6" />
  <line x1="230" y1="165" x2="300" y2="165" stroke="#000" stroke-width="1.6" />
  <text x="195" y="190" class="bold">R</text><text x="205" y="193" style="font-size: 10px;">2</text>

  <!-- Node dots -->
  <circle cx="100" cy="130" r="3" fill="#000" />
  <circle cx="300" cy="130" r="3" fill="#000" />

</svg>