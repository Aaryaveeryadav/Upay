name: Trust and reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: find assets/js api lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python3 tools/check/outline_notes.py
      - run: node tools/check/serverless_smoke.js
      - run: node tools/check/trust_controls.js
      - run: python3 tools/check/backend_smoke.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.58.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Physics and security browser checks
        run: |
          HOST=0.0.0.0 PORT=8004 node server.js > /tmp/upay-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8004/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Server did not start')
          PY
          python3 tools/check/physics_outline_smoke.py
          python3 tools/check/trust_browser_smoke.py
          python3 tools/check/security_headers.py
