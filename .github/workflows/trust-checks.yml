name: Trust and reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: find assets/js api lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python3 tools/check/outline_notes.py
      - run: node tools/check/serverless_smoke.js
      - run: node tools/check/provider_budget.js
      - run: node tools/check/generated_paper.js
      - run: node tools/check/mock_assessment.js
      - run: node tools/check/mistake_queue.js
      - run: node tools/check/language_integrity.js
      - run: node tools/check/physics_question_quality.js
      - run: node tools/check/ai_diagram_geometry.js
      - run: node tools/check/worked_figures.js
      - run: node tools/check/matrices.js
      - run: node tools/check/question_audit.js
      - run: node tools/check/solve_parts.js
      - run: node tools/check/answer_format.js
      - run: node tools/check/teacher_voice.js
      - run: node tools/check/prime_power_ratio.js
      - run: node tools/check/square_integers.js
      - run: node tools/check/radical_integers.js
      - run: node tools/check/science_diagrams.js
      - run: node tools/check/task_routing.js
      - run: node tools/check/prose_answers.js
      - run: node tools/check/trust_controls.js
      - run: node tools/check/question_text_audit.js
      - run: node tools/check/social_source_verification.js
      - run: node tools/check/social_2023_verification.js
      - run: node tools/check/hindi_practice_papers.js
      - run: node tools/check/question_language_and_ai_checks.js
      - run: node tools/check/ai_access.js
      - run: node tools/check/security_posture.js
      - run: python3 tools/check/backend_smoke.py
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Use the image's native Python/pip instead of a host-toolcache Python
      # built for ubuntu-latest, which may not match this Noble container.
      - run: python3 tools/check/run_ci_check.py python3 -m pip install playwright==1.58.0 2>&1 | tee -a /tmp/browser-logs.txt
      - run: npm install --prefix /tmp/upay-diagram-check playwright@1.58.0 pngjs@7.0.0
      # The matching image already contains Chromium and OS dependencies.
      # Avoid the failing runtime browser/apt installation step.
      - name: Physics and security browser checks
        run: |
          set -o pipefail
          # The Actions log CDN is not reachable from every environment, so a
          # failure is echoed as an annotation, which is readable from the API.
          report() {
            code=$?
            if [ "$code" -ne 0 ] && [ -f /tmp/browser-logs.txt ]; then
              msg=$(tail -n 25 /tmp/browser-logs.txt | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Browser check failed::$msg"
            fi
            exit "$code"
          }
          trap report EXIT
          echo "== browser checks =="
          HOST=0.0.0.0 PORT=8004 node server.js > /tmp/upay-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8004/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Server did not start')
          PY
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/ai_diagram_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/worked_figure_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/question_audio_format_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/prime_power_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/dual_diagram_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/save_question_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/written_answers_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/practice_grading_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/pyq.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/pasted_question_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/science_timeout_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/share_mock_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/daily_mock_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/mistake_confirmation_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/language_integrity_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/adaptive_approaches_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/red_theme_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/branding_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/google_welcome_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/signup_feedback_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/square_integer_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/science_diagram_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/task_routing_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py node tools/check/social_board_key_browser.js 2>&1 | tee -a /tmp/browser-logs.txt
          UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/run_ci_check.py python3 tools/check/physics_quality_browser.py 2>&1 | tee -a /tmp/browser-logs.txt
          python3 tools/check/run_ci_check.py python3 tools/check/physics_outline_smoke.py 2>&1 | tee -a /tmp/browser-logs.txt
          python3 tools/check/run_ci_check.py python3 tools/check/trust_browser_smoke.py 2>&1 | tee -a /tmp/browser-logs.txt
          python3 tools/check/run_ci_check.py python3 tools/check/solve_policy_browser.py 2>&1 | tee -a /tmp/browser-logs.txt
          python3 tools/check/run_ci_check.py python3 tools/check/ai_access_browser.py 2>&1 | tee -a /tmp/browser-logs.txt
          python3 tools/check/run_ci_check.py python3 tools/check/security_headers.py 2>&1 | tee -a /tmp/browser-logs.txt
      # The Actions log API is not always reachable; keep the browser output as
      # an artifact so a red build can still be diagnosed.
      # Logs and artifacts live on a CDN that is not reachable from every
      # environment; the job summary is readable straight from the API, so the
      # failing output is copied there as well.
      - name: Save browser logs
        if: always()
        run: |
          if [ -f /tmp/browser-logs.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -c 60000 /tmp/browser-logs.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs
          path: /tmp/browser-logs.txt
          if-no-files-found: ignore
