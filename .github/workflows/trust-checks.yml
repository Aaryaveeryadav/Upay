name: Trust and reliability
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: find assets/js api lib -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python3 tools/check/outline_notes.py
      - run: node tools/check/serverless_smoke.js
      - run: node tools/check/provider_budget.js
      - run: node tools/check/mock_assessment.js
      - run: node tools/check/mistake_queue.js
      - run: node tools/check/language_integrity.js
      - run: node tools/check/physics_question_quality.js
      - run: node tools/check/ai_diagram_geometry.js
      - run: node tools/check/answer_format.js
      - run: node tools/check/teacher_voice.js
      - run: node tools/check/prime_power_ratio.js
      - run: node tools/check/square_integers.js
      - run: node tools/check/radical_integers.js
      - run: node tools/check/science_diagrams.js
      - run: node tools/check/task_routing.js
      - run: node tools/check/prose_answers.js
      - run: node tools/check/trust_controls.js
      - run: node tools/check/ai_access.js
      - run: python3 tools/check/backend_smoke.py
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.58.0
      - run: npm install --prefix /tmp/upay-diagram-check playwright@1.58.0 pngjs@7.0.0
      # The matching image already contains Chromium and OS dependencies.
      # Avoid the failing runtime browser/apt installation step.
      - name: Physics and security browser checks
        run: |
          HOST=0.0.0.0 PORT=8004 node server.js > /tmp/upay-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8004/', timeout=1)
                  break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Server did not start')
          PY
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/ai_diagram_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/question_audio_format_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/prime_power_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/dual_diagram_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/save_question_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/pasted_question_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/science_timeout_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/share_mock_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/mistake_confirmation_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/language_integrity_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/adaptive_approaches_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/red_theme_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/branding_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/google_welcome_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/square_integer_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/science_diagram_browser.js
          NODE_PATH=/tmp/upay-diagram-check/node_modules UPAY_BASE=http://127.0.0.1:8004 node tools/check/task_routing_browser.js
          UPAY_BASE=http://127.0.0.1:8004 python3 tools/check/physics_quality_browser.py
          python3 tools/check/physics_outline_smoke.py
          python3 tools/check/trust_browser_smoke.py
          python3 tools/check/solve_policy_browser.py
          python3 tools/check/ai_access_browser.py
          python3 tools/check/security_headers.py
